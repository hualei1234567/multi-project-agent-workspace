<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Workspace</title>
<style>
:root {
  --bg: #f5f6f8;
  --panel: #ffffff;
  --panel-2: #f8fafc;
  --line: #e3e8ef;
  --line-strong: #cbd5e1;
  --text: #101828;
  --text-2: #475467;
  --muted: #667085;
  --primary: #1677ff;
  --primary-weak: #eff6ff;
  --run: #12b76a;
  --run-weak: #ecfdf3;
  --done: #1677ff;
  --stall: #f79009;
  --stall-weak: #fffaeb;
  --err: #f04438;
  --err-weak: #fef3f2;
  --idle: #98a2b3;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.1);
  --shadow-md: 0 4px 8px -2px rgba(16,24,40,.1), 0 2px 4px -2px rgba(16,24,40,.06);
  --shadow-lg: 0 20px 24px -4px rgba(16,24,40,.08), 0 8px 8px -4px rgba(16,24,40,.03);
  --radius: 12px;
}
html[data-theme="dark"] {
  --bg: #0F172A;
  --panel: #1B2336;
  --panel-2: #161E2E;
  --line: #2B3648;
  --line-strong: #3B4A63;
  --text: #E6EDF7;
  --text-2: #C4D0E0;
  --muted: #94A3B8;
  --primary: #4C9AFF;
  --primary-weak: #172A46;
  --run: #3ddc97;
  --run-weak: #10261d;
  --done: #4c9aff;
  --stall: #fdb022;
  --stall-weak: #2a2113;
  --err: #ff6b6b;
  --err-weak: #2b1618;
  --idle: #64748b;
  --shadow-sm: 0 1px 2px rgba(0,0,0,.25);
  --shadow-md: 0 1px 2px rgba(0,0,0,.25);
  --shadow-lg: 0 1px 2px rgba(0,0,0,.25);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); overflow-x: hidden;
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro SC", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; }
a { color: var(--primary); }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ---------- 应用外壳 / Sidebar ---------- */
.app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
.app.collapsed { grid-template-columns: 64px minmax(0, 1fr); }
.sidebar {
  position: sticky; top: 0; height: 100vh; z-index: 45;
  background: var(--panel); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; overflow: hidden;
}
.sb-brand {
  display: flex; align-items: center; gap: 10px; padding: 16px 14px;
  border-bottom: 1px solid var(--line); min-height: 64px;
}
.brand-mark {
  width: 32px; height: 32px; flex: none; border-radius: 9px; display: grid; place-items: center;
  background: var(--primary); color: #fff;
  font-weight: 700; font-size: 12px; letter-spacing: .4px; box-shadow: var(--shadow-sm);
}
.sb-brand-text { min-width: 0; }
.sb-brand-text strong { display: block; font-size: 14px; font-weight: 680; line-height: 1.3; }
.sb-brand-text span { display: block; font-size: 11px; color: var(--muted); letter-spacing: .04em; }
.sb-collapse {
  margin-left: auto; border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  width: 26px; height: 26px; border-radius: 7px; cursor: pointer; line-height: 1; flex: none;
}
.sb-collapse:hover { color: var(--text); border-color: var(--line-strong); }
.sb-nav { flex: 1; overflow-y: auto; padding: 12px 10px 4px; display: grid; gap: 6px; align-content: start; }
.sb-link, .sb-proj {
  display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text-2);
  border-radius: 8px; padding: 8px 9px; font-size: 13px; border: 1px solid transparent;
  min-width: 0; transition: background .14s, color .14s, border-color .14s;
}
.sb-link:hover, .sb-proj:hover { background: var(--panel-2); color: var(--text); }
.sb-link.active { background: var(--primary-weak); color: var(--primary); border-color: color-mix(in srgb, var(--primary) 24%, transparent); }
.sb-link .ico { width: 18px; text-align: center; flex: none; }
.sb-search {
  display: flex; align-items: center; gap: 6px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; margin: 2px 0 4px;
}
.sb-search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
.sb-search input { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; font-size: 12.5px; min-width: 0; }
.sb-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 9px 2px; }
.sb-projects { display: grid; gap: 2px; }
.sb-proj { align-items: flex-start; flex-direction: column; gap: 2px; padding: 7px 9px 7px 26px; position: relative; }
.sb-proj.active { background: var(--primary-weak); border-color: color-mix(in srgb, var(--primary) 24%, transparent); }
.sb-proj .pdot { position: absolute; left: 10px; top: 12px; }
.sb-proj-name { font-size: 12.8px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sb-proj-meta { font-size: 10.8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sb-proj.active .sb-proj-name { color: var(--primary); }
.sb-new {
  margin: 6px 0 2px; border: 1px dashed var(--line-strong); background: transparent; color: var(--muted);
  border-radius: 8px; padding: 7px 9px; font-size: 12.5px; cursor: pointer; text-align: left;
}
.sb-new:hover { color: var(--primary); border-color: var(--primary); }
.sb-foot { border-top: 1px solid var(--line); padding: 8px 10px; display: flex; align-items: center; gap: 6px; }
.sb-foot .sb-link { flex: 1; padding: 6px 8px; }
.sb-status { font-size: 10.5px; color: var(--muted); padding: 0 10px 10px; display: flex; align-items: center; gap: 6px; }
.app.collapsed .sb-hide, .app.collapsed .sb-search, .app.collapsed .sb-label, .app.collapsed .sb-new { display: none; }
.app.collapsed .sb-brand { padding: 14px 10px 12px; justify-content: center; }
.app.collapsed .sb-brand .brand-mark { display: none; }
.app.collapsed .sb-collapse { display: block; margin: 0 auto; }
.app.collapsed .sb-nav { padding: 10px 6px; }
.app.collapsed .sb-link { justify-content: center; padding: 8px 4px; }
.app.collapsed .sb-proj { padding: 8px 4px; justify-content: center; align-items: center; }
.app.collapsed .sb-proj .pdot { display: none; }
.app.collapsed .sb-proj-initial { display: block; }
.sb-proj-initial { display: none; font-weight: 700; font-size: 12px; color: var(--muted); }
.app.collapsed .sb-foot { justify-content: center; }
.overlay-mobile { display: none; }

/* ---------- 顶部栏 ---------- */
.shell { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 40; min-height: 56px;
  background: color-mix(in srgb, var(--panel) 90%, transparent);
  backdrop-filter: saturate(180%) blur(12px);
  border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding: 8px 20px;
}
.menu-btn { display: none; border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px;
  width: 34px; height: 32px; cursor: pointer; color: var(--text-2); }
.crumb { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 7px; min-width: 0; flex-wrap: wrap; }
.crumb a { color: var(--muted); text-decoration: none; }
.crumb a:hover { color: var(--primary); }
.crumb .cur { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 42vw; }
.topbar .toolbar { margin-left: auto; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.search {
  display: flex; align-items: center; gap: 6px; background: var(--panel-2);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; min-width: 220px;
  transition: border-color .18s, box-shadow .18s;
}
.search:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
.search input { border: 0; outline: 0; background: transparent; color: var(--text); width: 100%; font-size: 13px; min-width: 0; text-overflow: ellipsis; }
.search input::placeholder { text-overflow: ellipsis; overflow: hidden; white-space: nowrap; }
.btn {
  border: 1px solid var(--line); background: var(--panel-2); border-radius: 8px;
  padding: 6px 12px; font-size: 12.5px; cursor: pointer; color: var(--text-2);
  transition: all .16s ease; text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
}
.btn:hover { border-color: var(--line-strong); color: var(--text); box-shadow: var(--shadow-sm); }
.btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-weak); }
.btn:disabled { opacity: .55; cursor: not-allowed; transform: none; }
.live { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--run); position: relative; flex: none; }
.pulse::after { content: ""; position: absolute; inset: -4px; border-radius: 50%;
  border: 1px solid var(--run); opacity: .6; animation: ping 2s ease-out infinite; }
.pulse.paused { background: var(--idle); }
.pulse.paused::after { display: none; }
.pulse.err { background: var(--err); }
.pulse.err::after { display: none; }
@keyframes ping { 0% { transform: scale(.6); opacity: .8 } 80%,100% { transform: scale(1.6); opacity: 0 } }
.sync { font-size: 11.5px; color: var(--muted); }
.sync.stale { color: var(--stall); font-weight: 600; }

/* ---------- 内容 ---------- */
main { max-width: 1600px; width: 100%; margin: 0 auto; padding: 28px 28px 48px; display: grid; gap: 20px; }
#tab-content { display: grid; gap: 20px; min-width: 0; }
section { display: grid; gap: 16px; min-width: 0; }
.page-head { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
.page-head h2 { font-size: 22px; margin: 0; font-weight: 650; letter-spacing: -.02em; }
.page-head .desc { margin: 3px 0 0; font-size: 12.5px; color: var(--muted); }
.page-head .spacer { margin-left: auto; }
.proj-head { display: grid; gap: 4px; min-width: 0; flex: 1; }
.proj-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.proj-title h2 { font-size: 21px; }
.proj-sub { font-size: 12.5px; color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.proj-meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 14px; flex-wrap: wrap; }
.proj-meta code { font-family: ui-monospace, Menlo, monospace; }
.status-badge {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600;
  border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; white-space: nowrap;
  color: var(--muted); background: var(--panel-2);
}
.status-badge .sdot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.status-badge.active { color: var(--run); border-color: color-mix(in srgb, var(--run) 38%, var(--line)); background: var(--run-weak); }
.status-badge.paused { color: var(--idle); }
.status-badge.risk { color: var(--stall); border-color: color-mix(in srgb, var(--stall) 40%, var(--line)); background: var(--stall-weak); }
.status-badge.archived { color: var(--muted); }
.pdot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); flex: none; }
.pdot.active { background: var(--run); }
.pdot.risk { background: var(--stall); }
.pdot.paused { background: var(--idle); }
.pdot.archived { background: var(--line-strong); }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); flex-wrap: wrap; margin-top: -8px; }
.tab {
  padding: 9px 13px; font-size: 13px; color: var(--muted); text-decoration: none;
  border-bottom: 2px solid transparent; margin-bottom: -1px; border-radius: 4px 4px 0 0;
}
.tab:hover { color: var(--text); background: var(--panel-2); }
.tab.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

.kpis { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 16px; }
.kpis.six { grid-template-columns: repeat(6, minmax(0,1fr)); }
.kpis.platform-kpis { grid-template-columns: repeat(7, minmax(0,1fr)); }
.kpis.five { grid-template-columns: repeat(5, minmax(0,1fr)); }
@media (max-width: 1439px) { .kpis.six { grid-template-columns: repeat(3, minmax(0,1fr)); } .kpis.platform-kpis { grid-template-columns: repeat(4, minmax(0,1fr)); } .kpis.five { grid-template-columns: repeat(3, minmax(0,1fr)); } }
@media (max-width: 1023px) { .kpis, .kpis.six { grid-template-columns: repeat(2, minmax(0,1fr)); } .kpis.platform-kpis { grid-template-columns: repeat(3, minmax(0,1fr)); } .kpis.five { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 1023px) {
  .topbar { flex-wrap: wrap; }
  .topbar .toolbar { flex: 1 1 100%; margin-left: 0; flex-wrap: wrap; gap: 6px; }
  .search.global-search { flex: 1 1 100%; max-width: none; }
  .topbar .live { display: none; }
  .user-name { display: none; }
  .user-chip { padding: 2px; }
}
@media (max-width: 767px) { .kpis, .kpis.six, .kpis.platform-kpis, .kpis.five { grid-template-columns: 1fr; } }
.kpi {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  padding: 18px; box-shadow: var(--shadow-sm); position: relative; overflow: hidden;
  transition: border-color .15s ease, box-shadow .15s ease; min-width: 0;
}
.kpi:hover { transform: none; border-color: var(--line-strong); box-shadow: var(--shadow-md); }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--primary); opacity: .85; }
.kpi.run::before { background: var(--run); }
.kpi.stall::before { background: var(--stall); }
.kpi.err::before { background: var(--err); }
.kpi .label { font-size: 12px; color: var(--muted); letter-spacing: .02em; overflow-wrap: anywhere; }
.kpi .value { font-size: 28px; font-weight: 700; line-height: 1.25; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi .hint { font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }

.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h2 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: -.01em; }
.sec-head .desc { font-size: 11.5px; color: var(--muted); }
.sec-head .count { margin-left: auto; font-size: 11.5px; color: var(--muted);
  background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; }

.proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.proj-card {
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 15px 16px; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; gap: 8px;
  cursor: pointer; transition: transform .18s, box-shadow .18s, border-color .18s; min-width: 0;
}
.proj-card:hover, .proj-card:focus-visible { box-shadow: var(--shadow-md); border-color: var(--line-strong); outline: none; }
.proj-card:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 28%, transparent); }
.proj-card .pc-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.proj-card .pc-name { font-size: 14.5px; font-weight: 680; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.proj-card .pc-code { font-family: ui-monospace, Menlo, monospace; font-size: 11px; color: var(--muted); }
.proj-card .pc-desc { font-size: 12px; color: var(--muted); min-height: 2.6em;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.proj-card .pc-stats { display: flex; gap: 12px; flex-wrap: wrap; font-size: 11.5px; color: var(--text-2);
  border-top: 1px dashed var(--line); padding-top: 8px; }
.proj-card .pc-stats b { font-variant-numeric: tabular-nums; }
.proj-card .pc-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted); margin-top: auto; }
.proj-card .pc-enter { margin-left: auto; color: var(--primary); font-weight: 600; }

.ev-list { display: grid; gap: 2px; }
.ev { display: grid; grid-template-columns: 74px 1fr auto; gap: 10px; padding: 8px 14px; font-size: 12.5px;
  border-bottom: 1px solid var(--line); align-items: baseline; }
.ev:last-child { border-bottom: 0; }
.ev .at { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 11px; }
.ev .msg { color: var(--text-2); overflow-wrap: anywhere; }
.ev .proj { color: var(--muted); font-size: 11px; white-space: nowrap; }

.dist { display: grid; gap: 9px; }
.dist-row { display: grid; grid-template-columns: 76px 1fr auto; gap: 10px; align-items: center; font-size: 12px; }
.dist-row .k { color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.dist-row .bar2 { height: 6px; border-radius: 999px; background: var(--line); overflow: hidden; }
.dist-row .bar2 i { display: block; height: 100%; background: var(--primary); border-radius: 999px; }
.dist-row .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.funnel { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; }
@media (max-width: 760px) { .funnel { grid-template-columns: repeat(2, minmax(0,1fr)); } }
.fstep { background: var(--panel-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.fstep .n { font-size: 22px; font-weight: 680; font-variant-numeric: tabular-nums; }
.fstep .l { font-size: 11px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
.fstep.blocked .n { color: var(--err); }
.fstep.done .n { color: var(--done); }
.fstep.doing .n { color: var(--run); }
.fstep.review .n { color: var(--stall); }

.role-card, .tcard, .acard, .file-row { cursor: pointer; }
.role-card:focus-visible, .tcard:focus-visible, .acard:focus-visible, .file-row:focus-visible {
  outline: 2px solid var(--primary); outline-offset: 2px;
}
.roster { position: relative; display: block; }
.roster::before { content: none; }
.org-tree { position: relative; display: flex; flex-direction: column; align-items: center; }
.org-owner-row { display: flex; justify-content: center; gap: 20px; width: 100%; flex-wrap: wrap; }
.org-owner { width: min(560px, 100%); }
.org-owner .role-card { min-height: 116px; border-color: color-mix(in srgb, var(--primary) 34%, var(--line)); box-shadow: var(--shadow-sm); }
.org-bus { position: relative; width: 100%; height: 34px; flex: none; }
.org-bus::before { content: ""; position: absolute; left: 50%; top: 0; width: 2px; height: 17px;
  transform: translateX(-1px); background: var(--line-strong); }
.org-bus::after { content: ""; position: absolute; top: 17px; height: 2px; background: var(--line-strong);
  left: calc(184px + (100% - 184px) / 6); right: calc(184px + (100% - 184px) / 6); }
.org-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; width: 100%; }
.org-layer { display: grid; grid-template-columns: 168px minmax(0, 1fr); gap: 16px; width: 100%; align-items: center; }
.org-layer-label { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line);
  background: color-mix(in srgb, var(--primary) 6%, transparent); }
.org-layer-label b { display: block; font-size: 12.5px; letter-spacing: .2px; }
.org-layer-label span { display: block; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
.org-cell { position: relative; display: flex; }
.org-cell > .role-card { flex: 1; min-height: 128px; }
.org-cell::before { content: ""; position: absolute; left: 50%; top: -17px; width: 2px; height: 17px;
  transform: translateX(-1px); background: var(--line-strong); }
.role-icon { width: 42px; height: 42px; flex: none; border-radius: 10px; display: grid; place-items: center;
  background: color-mix(in srgb, var(--primary) 10%, transparent);
  border: 1px solid color-mix(in srgb, var(--primary) 26%, var(--line)); color: var(--primary); }
.role-icon svg { width: 22px; height: 22px; }
.org-owner .role-icon { width: 50px; height: 50px; background: color-mix(in srgb, var(--primary) 16%, transparent); }
.kpis > *, .roster > *, .kanban > *, .agents > *, .two-col > * { min-width: 0; }
@media (max-width: 1024px) {
  .org-layer { grid-template-columns: 1fr; gap: 8px; }
  .org-layer-label { justify-self: start; }
  .org-bus { display: none; }
  .org-row { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
  .org-cell::before { display: none; }
  .org-owner { width: 100%; margin-bottom: 12px; }
}
@media (max-width: 620px) { .org-row { grid-template-columns: 1fr; } }
.role-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 15px; position: relative; overflow: hidden;
  transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
  display: flex; flex-direction: column; min-height: 132px; }
.role-card:hover { box-shadow: var(--shadow-md); border-color: var(--line-strong); }
.role-card.running { border-color: color-mix(in srgb, var(--run) 45%, var(--line)); }
.role-card.running::after { content: ""; position: absolute; inset: 0; pointer-events: none;

.kanban { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; }
@media (max-width: 1200px) { .kanban { grid-template-columns: repeat(2, minmax(0,1fr)); } }
@media (max-width: 680px) { .kanban { grid-template-columns: 1fr; } }
.col { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-width: 0; }
.col[data-key="todo"] .col-bar i { background: var(--idle); }

.col[data-key="review"] .col-bar i { background: var(--stall); }
.col[data-key="done"] .col-bar i { background: var(--done); }
.col[data-key="blocked"] .col-bar i { background: var(--err); }
.more { width: 100%; margin-top: 6px; border: 1px dashed var(--line-strong); background: transparent;
  color: var(--muted); border-radius: 8px; padding: 6px; font-size: 11.5px; cursor: pointer; }
.more:hover { color: var(--primary); border-color: var(--primary); }
.col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 10px; }
.col-head h3 { font-size: 12.5px; margin: 0; font-weight: 640; }
.col-head .n { margin-left: auto; font-size: 11px; color: var(--muted); background: var(--panel);
  border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; font-variant-numeric: tabular-nums; }
.col-bar { height: 3px; border-radius: 3px; background: var(--line); margin: 0 4px 10px; overflow: hidden; }

.tcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 11px;
  margin-bottom: 8px; transition: all .16s ease; }

.tcard .tid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
.tcard .tt { font-size: 12.5px; line-height: 1.45; margin: 3px 0 6px;
  display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.tcard .trow { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 11px; color: var(--muted); }
.pri { font-weight: 650; }
.pri-P0 { color: var(--err); } .pri-P1 { color: var(--stall); } .pri-P2 { color: var(--muted); }
.links { display: inline-flex; gap: 6px; }
.links span, .links a { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; text-decoration: none;
  color: var(--primary); background: var(--primary-weak); border-radius: 5px; padding: 0 5px; }
.muted { color: var(--muted); }
.empty { color: var(--muted); font-size: 12px; padding: 10px 4px; text-align: center; }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-sm); overflow: hidden; }

#wt { min-width: 520px; }
#reports { min-width: 430px; }
.panel-pad { padding: 18px; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }

/* 5 列：未提交徽标并入最近提交，HEAD 保持独立短列 */
/* 角色/目录/分支/HEAD/最近提交：默认宽度保证 1440 下名称、仓库名、SHA+徽标完整；数字列可拖拽放大 */
#wt col.c-role { width: 17%; } #wt col.c-path { width: 26%; } #wt col.c-branch { width: 18%; }
#wt col.c-head { width: 14%; } #wt col.c-last { width: 25%; }
#wt th, #wt td { padding-left: 8px; padding-right: 8px; }
#wt th { font-size: 11px; letter-spacing: 0; }
/* 角色列：角色名完整展示（可换行），形态放第二行 pill */
#wt td.wt-role { white-space: normal; overflow: visible; line-height: 1.25; }
#wt td.wt-role .wt-role-name { display: block; font-weight: 620; color: var(--text); overflow-wrap: break-word; }
#wt td.wt-role .wt-form { display: inline-block; margin-top: 3px; font-size: 9.5px; line-height: 1.45;
  color: var(--muted); border: 1px solid var(--line); background: var(--panel-2);
  border-radius: 5px; padding: 0 5px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* 目录列只展示路径尾部（仓库目录名），完整路径在 title */
#wt td.wt-tail { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10.5px; }
/* 最近提交允许两行：短 sha 已在「状态」列，这里只展示提交说明 */
#wt td.wt-last { white-space: normal; font-size: 11px; line-height: 1.35; overflow: hidden; }
#wt td.wt-last .wt-msg { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* HEAD 列同时承载「未提交」徽标，最近提交整列留给提交说明，避免文字被挤出单元格 */
#wt td.wt-head { white-space: nowrap; font-size: 10px; letter-spacing: -.2px; overflow: hidden; }
#wt td.wt-head .badge-dirty { margin-left: 4px; font-size: 9px; padding: 0 3px; }
/* 1380 以下：HEAD 需同时放 sha 与未提交徽标，路径列让一点宽度 */
@media (max-width: 1379px) {
  #wt col.c-role { width: 17%; } #wt col.c-path { width: 26%; } #wt col.c-branch { width: 18%; }
  #wt col.c-head { width: 14%; } #wt col.c-last { width: 25%; }
}
/* 单列布局（<=1023）卡片更宽，列宽按比例回一点给角色/目录 */
@media (max-width: 1023px) {
  #wt col.c-role { width: 17%; } #wt col.c-path { width: 26%; } #wt col.c-branch { width: 18%; }
  #wt col.c-head { width: 14%; } #wt col.c-last { width: 25%; }
}
#reports col.c-name { width: 42%; } #reports col.c-dir { width: 16%; }
#reports col.c-size { width: 12%; } #reports col.c-time { width: 30%; }
#deliveries col.c-name { width: 26%; } #deliveries col.c-stage { width: 10%; }
#deliveries col.c-check { width: 10%; } #deliveries col.c-kind { width: 9%; }
#deliveries col.c-task { width: 11%; } #deliveries col.c-time { width: 14%; }
#deliveries col.c-act { width: 20%; }

.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); }
.badge-dirty { color: var(--stall); font-weight: 650; }
.two-col { display: grid; grid-template-columns: minmax(0,1.6fr) minmax(0,1fr); gap: 12px; align-items: stretch; }

.two-col > .panel { height: 100%; display: flex; flex-direction: column; min-width: 0; }

.agents { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0,1fr)); }

.acard { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);

.acard .desc { margin-top: 6px; font-size: 12.5px; color: var(--text-2);

.mask { position: fixed; inset: 0; background: rgba(16,24,40,.45); backdrop-filter: blur(2px);

.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(520px, 92vw); z-index: 60;

.sub-title { font-size: 12px; font-weight: 640; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.list { display: grid; gap: 6px; }

  opacity: 0; pointer-events: none; transition: all .2s ease; }

.field { display: grid; gap: 5px; }
.field label { font-size: 12px; color: var(--muted); }
.field input, .field textarea, .field select {
  border: 1px solid var(--line); background: var(--panel-2); color: var(--text); border-radius: 8px;
  padding: 8px 10px; font: inherit; font-size: 13px; width: 100%; outline: none;
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
.field textarea { min-height: 74px; resize: vertical; }
.form-actions { display: flex; gap: 8px; justify-content: flex-end; }

.skeleton { background: linear-gradient(90deg, var(--panel-2) 25%, var(--line) 37%, var(--panel-2) 63%);
  background-size: 400% 100%; animation: shimmer 1.4s ease infinite; border-radius: 8px; }

.banner { border: 1px solid var(--err); background: var(--err-weak); color: var(--err);

.state-box { background: var(--panel); border: 1px dashed var(--line-strong); border-radius: 12px;
  padding: 24px; text-align: center; color: var(--muted); display: grid; gap: 8px; justify-items: center; }

.drawer.wide { width: min(940px, 96vw); }

  border-bottom: 1px solid var(--line); background: var(--panel-2); }

.tl { border-left: 2px solid var(--line); padding: 4px 0 4px 12px; position: relative; }

.live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--run);

/* ---------- 二期：状态徽标 / 表单 / 审计 ---------- */
.st-pill {
  display: inline-flex; align-items: center; gap: 5px; font-size: 10.8px; font-weight: 620;
  border: 1px solid var(--line); border-radius: 999px; padding: 0 8px; white-space: nowrap;
  color: var(--muted); background: var(--panel-2);
}
.st-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.st-pill.todo { color: var(--idle); }
.st-pill.in_progress { color: var(--run); border-color: color-mix(in srgb, var(--run) 38%, var(--line)); background: var(--run-weak); }
.st-pill.review, .st-pill.in_review { color: var(--stall); border-color: color-mix(in srgb, var(--stall) 40%, var(--line)); background: var(--stall-weak); }
.st-pill.done, .st-pill.accepted { color: var(--done); border-color: color-mix(in srgb, var(--done) 38%, var(--line)); background: var(--primary-weak); }
.st-pill.blocked, .st-pill.rejected { color: var(--err); border-color: color-mix(in srgb, var(--err) 40%, var(--line)); background: var(--err-weak); }
.st-pill.submitted { color: var(--primary); border-color: color-mix(in srgb, var(--primary) 40%, var(--line)); background: var(--primary-weak); }
.readonly-chip { font-size: 9.8px; color: var(--muted); border: 1px dashed var(--line-strong); border-radius: 5px; padding: 0 5px; white-space: nowrap; }
.notice {
  border: 1px solid color-mix(in srgb, var(--run) 45%, var(--line)); background: var(--run-weak);
  color: var(--run); border-radius: 10px; padding: 9px 13px; font-size: 12.5px;
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
}
.notice .grow { flex: 1; min-width: 140px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 620px) { .form-row { grid-template-columns: 1fr; } }
.form-grid { display: grid; gap: 10px; }
.field .hint { font-size: 11px; color: var(--muted); }
.inline-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.btn.danger { border-color: color-mix(in srgb, var(--err) 45%, var(--line)); color: var(--err); background: var(--err-weak); }
.btn.danger:hover { border-color: var(--err); color: var(--err); }
.btn.primary { border-color: var(--primary); color: var(--primary); background: var(--primary-weak); font-weight: 600; }
.btn.sm { padding: 3px 9px; font-size: 11.5px; }
.field input:disabled, .field textarea:disabled, .field select:disabled { opacity: .58; cursor: not-allowed; }
.archived-banner { margin-bottom: 2px; }
.tk-actions { display: grid; gap: 8px; }
.tk-actions .lbl { font-size: 11.5px; color: var(--muted); }
.tk-timeline { display: grid; gap: 0; }
.tk-ev { display: grid; grid-template-columns: 92px 1fr; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 12px; }
.tk-ev:last-child { border-bottom: 0; }
.tk-ev .at { color: var(--muted); font-family: ui-monospace, Menlo, monospace; font-size: 10.8px; }
.tk-ev .msg { color: var(--text-2); overflow-wrap: anywhere; }
.tk-sub { font-size: 12.5px; color: var(--text-2); white-space: pre-wrap; }
.criteria { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--text-2); display: grid; gap: 3px; }
.col.drag-over { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--panel-2)); }
.tcard[draggable="true"] { cursor: grab; }
.tcard[draggable="true"]:active { cursor: grabbing; }
.audit-filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; }
.audit-filters .field { min-width: 150px; flex: 1 1 150px; }
.audit-filters .field input, .audit-filters .field select { padding: 6px 9px; font-size: 12.5px; }
.pager { display: flex; align-items: center; gap: 8px; justify-content: flex-end; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.pager .btn { padding: 3px 10px; font-size: 12px; }
#audit-table col.c-time { width: 19%; } #audit-table col.c-proj { width: 15%; }
#audit-table col.c-action { width: 19%; } #audit-table col.c-res { width: 25%; }
#audit-table col.c-ok { width: 9%; } #audit-table col.c-actor { width: 13%; }
#deliveries col.c-name { width: 24%; } #deliveries col.c-stage { width: 10%; }
#deliveries col.c-check { width: 10%; } #deliveries col.c-kind { width: 8%; }
#deliveries col.c-task { width: 10%; } #deliveries col.c-time { width: 14%; }
#deliveries col.c-act { width: 24%; }


/* ---------- 交付中心（提交 → 校验 → 验收 → 返工） ---------- */
.dlv-flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; align-items: center; }
.dlv-flow::before { content: "交付流程"; font-size: 12px; color: var(--muted); margin-right: 2px; }
.dlv-stage { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 12.5px; cursor: pointer; }
.dlv-stage span { font-family: var(--mono, ui-monospace, monospace); color: var(--muted); }
.dlv-stage.on { border-color: var(--accent); color: var(--accent); }
.dlv-stage.on span { color: var(--accent); }
.dlv-badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px;
  font-size: 11.5px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.dlv-badge.ok { color: var(--ok, #3fb950); border-color: currentColor; }
.dlv-badge.bad { color: var(--bad, #f85149); border-color: currentColor; }
.dlv-badge.warn { color: var(--warn, #d29922); border-color: currentColor; }
.dlv-rw { font-size: 11px; color: var(--warn, #d29922); border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; }
.dlv-ops { display: flex; gap: 6px; flex-wrap: nowrap; }
.dlv-ops .btn { padding: 2px 8px; font-size: 12px; }
.dlv-steps { display: flex; align-items: center; gap: 6px; margin: 14px 0 4px; flex-wrap: wrap; }
.dlv-step { font-size: 12px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.dlv-step.done { color: var(--ok, #3fb950); border-color: currentColor; }
.dlv-step.active { color: var(--accent); border-color: currentColor; box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 20%, transparent); }
.dlv-step.fail { color: var(--bad, #f85149); border-color: currentColor; }
.dlv-step.skip { opacity: .45; text-decoration: line-through; }
.dlv-sep { width: 14px; height: 1px; background: var(--line); display: inline-block; }
.dlv-sec { margin-top: 16px; }
.dlv-sec h4 { font-size: 13px; margin: 0 0 8px; display: flex; align-items: baseline; gap: 8px; }
.dlv-sub { font-size: 11.5px; color: var(--muted); font-weight: 400; }
.dlv-checks, .dlv-hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.dlv-check { display: grid; grid-template-columns: 20px 88px 1fr auto; gap: 8px; align-items: baseline;
  font-size: 12.5px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.dlv-check .dlv-ck { font-family: var(--mono, ui-monospace, monospace); text-align: center; }
.dlv-check .k { color: var(--muted); }
.dlv-check .v { color: var(--fg); overflow-wrap: anywhere; }
.dlv-check .dlv-cs { font-size: 11px; color: var(--muted); }
.dlv-check.pass .dlv-ck, .dlv-check.pass .dlv-cs { color: var(--ok, #3fb950); }
.dlv-check.fail .dlv-ck, .dlv-check.fail .dlv-cs { color: var(--bad, #f85149); }
.dlv-check.unverified .dlv-ck, .dlv-check.unverified .dlv-cs { color: var(--warn, #d29922); }
.dlv-hist li { display: grid; grid-template-columns: 88px 96px 1fr; gap: 8px; font-size: 12.5px;
  padding: 4px 0; border-bottom: 1px dashed var(--line); }
.dlv-hist .at { color: var(--muted); }
.dlv-hist .lb { color: var(--fg); }
.dlv-hist .dt { color: var(--muted); overflow-wrap: anywhere; }
#modal-body .dlv-sec + .form-actions { margin-top: 18px; }


/* ---------- 执行时间线（四态） ---------- */
.tl-flow { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 12px; }
.tl-chip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); font-size: 12.5px; cursor: pointer; }
.tl-chip span { font-family: var(--mono, ui-monospace, monospace); color: var(--muted); }
.tl-chip.on { border-color: var(--accent); color: var(--accent); }
.tl-chip.on span { color: var(--accent); }
.tl-list { display: flex; flex-direction: column; gap: 6px; }
.tl-row { display: grid; grid-template-columns: 8px 82px 72px 110px 130px 1fr; gap: 10px; align-items: center;
  padding: 7px 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); font-size: 12.5px; }
.tl-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.tl-row.running .tl-dot { background: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
.tl-row.failed .tl-dot { background: var(--bad, #f85149); }
.tl-row.unverified .tl-dot { background: var(--warn, #d29922); }
.tl-row.ok .tl-dot { background: var(--ok, #3fb950); }
.tl-time { color: var(--muted); }
.tl-state { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); text-align: center; }
.tl-state.running { color: var(--accent); border-color: currentColor; }
.tl-state.failed { color: var(--bad, #f85149); border-color: currentColor; }
.tl-state.unverified { color: var(--warn, #d29922); border-color: currentColor; }
.tl-state.ok { color: var(--ok, #3fb950); border-color: currentColor; }
.tl-agent { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-type { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-msg { color: var(--muted); overflow-wrap: anywhere; }
.tl-note { margin: 10px 2px 0; font-size: 11.5px; color: var(--muted); }
@media (max-width: 900px) {
  .tl-row { grid-template-columns: 8px 68px 64px 1fr; }
  .tl-agent, .tl-type { display: none; }
}

/* ---------- 表格：列宽拖拽 + 多行完整显示 ---------- */
thead th { position: relative; }
.col-resizer {
  position: absolute; top: 0; right: -4px; width: 8px; height: 100%;
  cursor: col-resize; z-index: 2; touch-action: none;
}
.col-resizer::after {
  content: ""; position: absolute; top: 20%; bottom: 20%; left: 3px; width: 2px;
  background: transparent; border-radius: 1px;
}
.col-resizer:hover::after, .col-resizer.active::after { background: var(--primary); }
body.col-resizing, body.col-resizing * { cursor: col-resize !important; user-select: none !important; }
.clamp-2, .clamp-3 {
  display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden;
  overflow-wrap: anywhere; white-space: normal;
}
.clamp-2 { -webkit-line-clamp: 2; }
.clamp-3 { -webkit-line-clamp: 3; }
td.wrap2 { white-space: normal; overflow-wrap: anywhere; line-height: 1.35; }
#wt td.wt-branch { white-space: normal; line-height: 1.3; font-size: 10px; letter-spacing: -.2px; word-break: break-all; }

#docs-table col.c-name { width: 44%; } #docs-table col.c-dir { width: 18%; }
#docs-table col.c-size { width: 12%; } #docs-table col.c-time { width: 26%; }
/* 窄屏：表格保持最小可读宽度，由容器内部横向滚动，不撑破页面 */
@media (max-width: 1023px) {
  #deliveries { min-width: 1040px; }

}

.search.global-search { min-width: 240px; max-width: 420px; flex: 1 1 260px; }
.search .kbd {
  flex: none;
  font-family: ui-monospace, Menlo, monospace; font-size: 10px; color: var(--muted);

}

}

.sb-brand-text strong { font-size: 11.2px; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

}

.chip-code { font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--muted);

.tabs { margin-top: 0; gap: 4px; }

.model-list .ml .row { display: flex; gap: 8px; }

.model-list .ml .bar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; }

@media (max-width: 767px) {

  .proj-hero { padding: 14px; }

  .proj-hero-actions { width: 100%; margin-left: 0; }
}

footer { color: var(--muted); font-size: 11.5px; text-align: center; padding: 6px 0 30px; }

/* 调度页（三期 M3-1）：只用页面已有变量，不引入新主题 */
.dp-ready h3 { margin: 16px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
.dp-plan { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; }
.dp-plan-head { display: flex; align-items: center; gap: 10px; }
.dp-log { background: var(--panel-2, #11151b); border: 1px solid var(--line); border-radius: 8px;
  padding: 12px; max-height: 420px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  font-size: 12px; line-height: 1.5; margin-top: 12px; }
@media (max-width: 767px) { .dp-plan-head { flex-wrap: wrap; } }

/* ---------- 移动端（三期 M3-4） ---------- */
/* 安全区：刘海屏/圆角屏底部不被遮挡 */
@media (max-width: 767px) {
  /* fixed 遮罩层在移动端会按内容宽度撑出滚动区，钉死宽度避免整页被顶宽 */
  .mask, .drawer { max-width: 100vw; }
  /* grid 子项默认 min-width:auto，长文本不换行会把父级顶宽（项目头实测溢出 38px） */
  .proj-hero, .proj-hero-main, .proj-head, .proj-title,
  .proj-sub, .proj-meta, .panel, .panel-body, .sec-head { min-width: 0; }
  .proj-title h2, .proj-sub, .proj-meta { overflow-wrap: anywhere; }
  body { padding-bottom: env(safe-area-inset-bottom, 0); overflow-x: hidden; }
  .topbar { padding-left: max(12px, env(safe-area-inset-left)); padding-right: max(12px, env(safe-area-inset-right)); }
  /* 触屏：可点区域不小于 40px，避免误触 */
  .btn, .ghost, .tab, .sb-proj { min-height: 40px; }
  /* 高频表格改卡片布局：横向滚动在手机上极难用 */
  #dp-ready table, #dp-plans table, .panel table { min-width: 0; width: 100%; }
  .panel .table-wrap { overflow-x: visible; }
  .panel .table-wrap table thead { display: none; }
  .panel .table-wrap table, .panel .table-wrap table tbody,
  .panel .table-wrap table tr, .panel .table-wrap table td { display: block; width: 100%; }
  .panel .table-wrap table tr {
    border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .panel .table-wrap table td { border: 0; padding: 4px 0; display: flex; gap: 10px; }
  .panel .table-wrap table td::before {
    content: attr(data-label); color: var(--muted); font-size: 11px; min-width: 68px; flex: none;
  }
  .dp-plan-head { flex-wrap: wrap; }
  .dp-log { max-height: 50vh; font-size: 11px; }
}

  .btn:hover, .sb-proj:hover { background: inherit; }
}

<script>
const $ = (s, root = document) => root.querySelector(s);
const $$ = (s, root = document) => Array.from(root.querySelectorAll(s));
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtDur = (s) => s == null ? "—" : (s >= 60 ? `${Math.floor(s/60)}m${s%60}s` : `${s}s`);
const fmtSize = (n) => n == null ? "—" : n > 1048576 ? (n/1048576).toFixed(1)+"M" : n > 1024 ? Math.round(n/1024)+"K" : n+"B";
const fmtNum = (n) => n == null || Number.isNaN(Number(n)) ? "—" : Number(n) >= 1e6 ? (Number(n)/1e6).toFixed(2)+"M" : Number(n) >= 1e3 ? (Number(n)/1e3).toFixed(1)+"k" : String(n);
const fmtUsd = (n) => n == null || n === "" || Number.isNaN(Number(n)) ? "—" : `$${Number(n).toFixed(2)}`;
const fmtTime = (iso) => !iso ? "—" : new Date(iso).toLocaleTimeString("zh-CN", {hour12:false});
const fmtDateTime = (iso) => !iso ? "—" : new Date(iso).toLocaleString("zh-CN", {hour12:false});
const ago = (iso) => {
  if (!iso) return "—";
  const t = new Date(iso).getTime();
  if (Number.isNaN(t)) return "—";
  const s = Math.max(0, (Date.now() - t) / 1000);
  if (s < 60) return `${Math.round(s)} 秒前`;
  if (s < 3600) return `${Math.round(s/60)} 分钟前`;
  if (s < 86400) return `${Math.round(s/3600)} 小时前`;
  return `${Math.round(s/86400)} 天前`;
};
const safeGet = (k) => { try { return localStorage.getItem(k); } catch { return null; } };
const safeSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };

const TAB_KEYS = ["overview", "agents", "tasks", "dispatch", "executions", "deliveries", "p4", "docs", "settings"];
const TAB_LABEL = { overview: "概览", agents: "Agent 看板", tasks: "任务看板", dispatch: "调度", executions: "执行记录", deliveries: "交付记录", p4: "智能层", docs: "文档配置", settings: "项目设置" };
const PLATFORM_KINDS = ["platform", "search", "work", "portfolio", "inbox", "projects", "favorites", "recent"];

function readIdList(key) {
  try {
    const v = JSON.parse(safeGet(key) || "[]");
    return Array.isArray(v) ? v.map(String) : [];
  } catch { return []; }
}
function writeIdList(key, list) {
  safeSet(key, JSON.stringify(Array.from(new Set(list.map(String))).slice(0, 20)));
}
function isFavorite(id) { return readIdList(FAV_KEY).includes(String(id)); }
/** 收藏：先写本机（离线回退），再同步后端；失败只 warn，不阻塞页面。 */
function toggleFavorite(id) {
  const key = String(id);
  const list = readIdList(FAV_KEY);
  const on = !list.includes(key);
  writeIdList(FAV_KEY, on ? [key, ...list] : list.filter(x => x !== key));
  renderSidebar();
  syncFavoriteButton();
  if (PLATFORM_KINDS.includes(ROUTE.kind)) renderPlatform(ROUTE.kind);
  apiFetch(`/api/projects/${encodeURIComponent(key)}/favorite`, { method: on ? "PUT" : "DELETE", cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(`HTTP ${r.status}`); })
    .catch((e) => {
      if (APP.favWarned) return;
      APP.favWarned = true;
      console.warn("[agws] favorite API 不可用，已回退 localStorage:", e.message);
    });
}
/** 最近访问：本机立即生效，同时异步上报 visit。 */
function touchRecent(id) {
  const key = String(id);
  const list = readIdList(RECENT_KEY).filter(x => x !== key);
  list.unshift(key);
  writeIdList(RECENT_KEY, list.slice(0, 8));
  apiFetch(`/api/projects/${encodeURIComponent(key)}/visit`, { method: "POST", cache: "no-store" })
    .catch((e) => {
      if (APP.visitWarned) return;
      APP.visitWarned = true;
      console.warn("[agws] visit API 不可用，已回退 localStorage:", e.message);
    });
}
/** 拉取服务端最近访问；失败回退本机缓存。 */
async function loadRecentProjects() {
  try {
    const d = await fetchJSON("/api/me/recent-projects");
    const items = Array.isArray(d?.items) ? d.items : (Array.isArray(d?.projects) ? d.projects : []);
    const ids = items.map(x => String(x?.id ?? x)).filter(Boolean);
    if (ids.length) {
      writeIdList(RECENT_KEY, ids);
      APP.recentIds = ids;
    }
    return APP.recentIds || readIdList(RECENT_KEY);
  } catch (e) {
    if (!APP.recentWarned) {
      APP.recentWarned = true;
      console.warn("[agws] recent-projects API 不可用，已回退 localStorage:", e.message);
    }
    return readIdList(RECENT_KEY);
  }
}
/** 服务端 favorite=true 合并进本机缓存（只增不减，避免覆盖离线收藏）。 */
function mergeServerFavorites(items) {
  const serverFavs = items.filter(p => p && p.favorite === true).map(p => String(p.id));
  if (!serverFavs.length) return;
  const merged = readIdList(FAV_KEY);
  let changed = false;
  for (const id of serverFavs) {
    if (!merged.includes(id)) { merged.unshift(id); changed = true; }
  }
  if (changed) writeIdList(FAV_KEY, merged);
}

}

/* ---------- 访问令牌（远端浏览器） ---------- */
// 远端访问需要 Bearer 令牌。首次用 ?token=xxx 打开后存进 localStorage，
// 之后所有请求自动带上；同时把 token 从地址栏抹掉，避免被复制/截图带出去。
const TOKEN_KEY = "agws-token";

function authToken() {
  try { return localStorage.getItem(TOKEN_KEY) || ""; } catch { return ""; }
}

function authHeaders(extra) {
  const t = authToken();
  const h = Object.assign({}, extra || {});
  if (t) h["Authorization"] = `Bearer ${t}`;
  return h;
}

function apiFetch(url, opts = {}) {
  return fetch(url, { ...opts, headers: authHeaders(opts.headers) });
}

(function captureTokenFromUrl() {
  try {
    const url = new URL(location.href);
    const t = url.searchParams.get("token");
    if (!t) return;
    localStorage.setItem(TOKEN_KEY, t);
    url.searchParams.delete("token");
    history.replaceState(null, "", url.pathname + (url.search || "") + (url.hash || ""));
  } catch { /* 隐私模式下 localStorage 不可用，忽略 */ }
})();

/* ---------- 请求 ---------- */
async function fetchJSON(url, opts = {}) {
  const res = await apiFetch(url, { cache: "no-store", ...opts });
  let body = null;
  try { body = await res.json(); } catch {}
  if (!res.ok) {
    const err = new Error(body?.error || body?.detail?.message || body?.detail || `HTTP ${res.status}`);
    err.status = res.status;
    err.body = body;
    throw err;
  }
  if (body && body.ok === false) {
    const err = new Error(body.error || "请求失败");
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

async function ensureProjects(force = false) {
  if (APP.projects.length && !force) return APP.projects;
  try {
    const d = await fetchJSON("/api/projects");
    const items = Array.isArray(d?.items) ? d.items : [];
    if (!items.length) throw new Error("项目列表为空");
    APP.projects = items;
    APP.defaultProjectId = d.default_project_id || items[0].id;
    APP.projectsErr = null;
    APP.degraded = false;
    mergeServerFavorites(items);
  } catch (e) {
    APP.projectsErr = e;
    if (!APP.projects.length) {
      APP.projects = [fallbackProject()];
      APP.defaultProjectId = APP.projects[0].id;
      APP.degraded = true;
    }
  }
  renderSidebar();
  return APP.projects;
}

function resolveProject(key) {
  if (!key) {
    key = APP.defaultProjectId || (APP.projects[0] && APP.projects[0].id) || "default";
  }
  const k = String(key);
  return APP.projects.find(p => String(p.id) === k)
    || APP.projects.find(p => String(p.code || "").toLowerCase() === k.toLowerCase())
    || null;
}

/* ---------- 路由 ---------- */
function parseRoute() {
  const raw = String(location.hash || "").replace(/^#/, "");
  const hit = raw.split("?");
  const path = hit[0] || "/";
  const params = new URLSearchParams(hit.slice(1).join("?"));
  if (path === "/" || path === "") return { kind: "platform", params };
  if (path === "/search") return { kind: "search", params };
  if (path === "/work") return { kind: "work", params };
  if (path === "/portfolio") return { kind: "portfolio", params };
  if (path === "/inbox") return { kind: "inbox", params };
  if (path === "/projects") return { kind: "projects", params };
  if (path === "/favorites") return { kind: "favorites", params };
  if (path === "/recent") return { kind: "recent", params };
  if (path === "/audit") return { kind: "audit", params };
  if (path === "/settings") return { kind: "settings", params };
  const m = path.match(/^\/p\/([^/]+)(?:\/([^/]+))?\/?$/);
  if (m) {
    const tabRaw = m[2] || "overview";
    return { kind: "project", key: decodeURIComponent(m[1]), tab: TAB_KEYS.includes(tabRaw) ? tabRaw : "overview", params, badTab: Boolean(m[2]) && !TAB_KEYS.includes(tabRaw) };
  }
  return { kind: "unknown", params };
}

function projectHash(project, tab = "overview", params = null) {
  const base = `#/p/${encodeURIComponent(project.id)}/${tab}`;
  const qs = params ? params.toString() : "";
  return qs ? `${base}?${qs}` : base;
}
function navigate(hash, replace = false) {
  if (replace) {
    history.replaceState(null, "", location.pathname + location.search + hash);
    onRoute();
  } else if (location.hash === hash) {
    onRoute();
  } else {
    location.hash = hash;
  }
}

/**
 * Agent 资源池（平台口径）：总量 = 所有项目 agent 数；可用 = idle/available；
 * Token = 平台 24h token 汇总。数据来自 /api/agent-platform/overview，
 * 随现有 15s 轮询刷新。加载中占位、失败显示 0 并在 title 说明原因。
 */
function updateResourcePool() {
  const card = $("#sb-resource");
  const avail = $("#sb-res-avail");
  const tok = $("#sb-res-token");
  if (!card || !avail || !tok) return;
  const ov = APP.overview;
  const err = APP.overviewErr;
  card.classList.remove("is-loading", "is-error");
  if (!ov) {
    if (err) {
      const why = `平台概览不可用：${err.message || "请求失败"}；显示 0 为占位值。`;
      avail.textContent = "0 / 0";
      tok.textContent = "0";
      card.classList.add("is-error");
      card.title = why; avail.title = why; tok.title = why;
    } else {
      avail.textContent = "— / —";
      tok.textContent = "—";
      card.classList.add("is-loading");
      card.title = avail.title = tok.title = "正在加载平台概览…";
    }
    card.setAttribute("aria-busy", "true");
    return;
  }
  const total = ov.agent_total;
  const idle = ov.agent_idle;
  const token = ov.token_24h;
  const missing = total == null || idle == null;
  avail.textContent = `${fmtNum(idle ?? 0)} / ${fmtNum(total ?? 0)}`;
  tok.textContent = fmtNum(token ?? 0);
  card.classList.toggle("is-error", missing);
  card.setAttribute("aria-busy", "false");
  const tokenNote = token == null ? "接口未返回 token_24h，显示 0 为占位值" : `平台所有项目近 24h Token 汇总：${fmtNum(token)}`;
  const availNote = missing
    ? "接口未返回 agent_total / agent_idle，显示 0 为占位值"
    : `可用（idle/available）${idle} / 平台 Agent 总数 ${total}`;
  card.title = `${availNote}；${tokenNote}`;
  avail.title = availNote;
  tok.title = tokenNote;
}

  if (!p) { el.hidden = true; el.innerHTML = ""; return; }
  const status = p.status || "unknown";
  const st = APP.state || {};
  const updated = st.generated_at || p.updated_at || null;
  const stale = APP.stateErr ? "数据异常" : (APP.state ? (APP.state.cache?.stale ? "数据陈旧" : "数据就绪") : "加载中");
  const dot = status === "active" ? "active" : status === "archived" ? "paused" : "risk";

  el.innerHTML = `
    <span class="ctx-chip"><span class="pdot ${dot}"></span>${esc(p.name)}</span>
    <span class="ctx-chip mono">${esc(p.code || "")}</span>
    <span class="ctx-chip">${esc(statusLabel(status))}</span>

}

function renderSidebar() {
  const list = APP.projects.filter(matchesProject);
  const activeId = ROUTE.kind === "project" ? String(APP.currentProject?.id || "") : "";
  const countEl = $("#sb-project-count");
  if (countEl) countEl.textContent = `(${APP.projects.length})`;
  if (!list.length) {
    $("#sb-projects").innerHTML = `<div class="empty">${APP.projects.length ? "没有找到匹配的项目" : "暂无项目"}</div>`;
  } else {
    $("#sb-projects").innerHTML = list.map(p => {
      const fav = isFavorite(p.id);
      const agent = p.stats?.agent_total;
      const todo = p.stats?.task_todo;
      const doing = p.stats?.task_in_progress;
      const unfinished = (typeof todo === "number" || typeof doing === "number") ? (Number(todo || 0) + Number(doing || 0)) : null;
      const desc = p.description || `${agent == null ? "—" : agent} Agent · 未完成 ${unfinished == null ? "—" : unfinished}`;
      return `<a class="sb-proj ${activeId && String(p.id) === activeId ? "active" : ""}" href="${projectHash(p, "overview")}" data-pid="${esc(p.id)}" title="${esc(p.name)} · ${esc(desc)}">
        <span class="sb-proj-avatar" style="--pc:${esc(projectColor(p))}" aria-hidden="true">${esc(projectInitial(p))}</span>
        <span class="sb-proj-body">
          <span class="sb-proj-name">${esc(p.name)}</span>
          <span class="sb-proj-desc">${esc(desc)}</span>
        </span>
        <button class="sb-proj-star ${fav ? "on" : ""}" data-fav="${esc(p.id)}" title="${fav ? "取消收藏" : "收藏项目"}" aria-label="${fav ? "取消收藏" : "收藏项目"}">${fav ? "★" : "☆"}</button>
      </a>`;
    }).join("");
  }
  $$("#sb-projects .sb-proj").forEach(el => {
    el.onclick = () => closeMobileSidebar();
  });
  $$("#sb-projects .sb-proj-star").forEach(btn => {
    btn.onclick = (e) => {
      e.preventDefault();
      e.stopPropagation();
      toggleFavorite(btn.dataset.fav);
    };
  });
  const ok = !APP.projectsErr && (APP.overview || APP.projects.length);
  const dot = $("#sb-conn-dot");
  if (dot) dot.className = "pdot " + (APP.projectsErr ? "risk" : ok ? "active" : "paused");
  const conn = $("#sb-conn-text");
  if (conn) conn.textContent = APP.projectsErr ? "后端连接异常" : APP.paused ? "已暂停刷新" : "实时连接正常";
  updateResourcePool();
  updateContextBar();
}


/* ---------- 平台总览 ---------- */
function platformNumbers() {
  const ov = APP.overview || {};
  const pj = APP.projects;
  const activeCount = pj.length ? pj.filter(p => p.status === "active").length : null;
  return {
    project_total: ov.project_total ?? (pj.length || null),
    project_active: ov.project_active ?? activeCount,
    agent_active: ov.agent_active ?? sumStat(pj, "agent_active"),
    task_in_progress: ov.task_in_progress ?? sumStat(pj, "task_in_progress"),
    task_blocked: ov.task_blocked ?? sumStat(pj, "task_blocked"),
    token_24h: ov.token_24h ?? sumStat(pj, "token_24h"),
    cost_24h: ov.cost_24h ?? sumStat(pj, "cost_24h"),
  };
}


/* ---------- 工作空间：我的工作 / 项目组合 / 消息中心 ---------- */
const WS = { work: null, portfolio: null, inbox: null, error: {}, busy: {} };

const WS_META = {
  work: ["我的工作", "可见范围内的任务、审批、待验收交付与最近执行；全部读取既有事实源，不复制业务状态。", "/api/workspace/my"],
  portfolio: ["项目组合", "逐项目健康快照。风险等级由显式规则推出（阻塞 / 待验收 / 待审批 / 久无活动）。", "/api/workspace/portfolio"],
  inbox: ["消息中心", "审批、交付、阻塞任务与执行异常的统一收件箱；已读只是个人偏好，不改业务状态。", "/api/workspace/notifications"],
};

async function loadWorkspaceData(kind, force = false) {
  if (WS[kind] && !force) return WS[kind];
  if (WS.busy[kind]) return null;
  WS.busy[kind] = true;
  try {
    WS[kind] = await fetchJSON(WS_META[kind][2]);
    WS.error[kind] = null;
  } catch (e) {
    WS.error[kind] = e.message || "加载失败";
  } finally {
    WS.busy[kind] = false;
  }
  return WS[kind];
}

function wsStateBox(kind) {
  if (WS.error[kind]) return emptyBox("加载失败", WS.error[kind]);
  return emptyBox("加载中…", "正在读取平台数据");
}

function riskBadge(risk) {
  const map = { high: ["高风险", "risk"], medium: ["关注", "paused"], low: ["正常", "active"] };
  const [text, cls] = map[risk] || ["未知", "paused"];
  return `<span class="ws-risk ${cls}">${text}</span>`;
}

function wsMetric(label, value, cls = "") {
  return `<div class="ws-metric ${cls}"><b>${esc(String(value))}</b><span>${esc(label)}</span></div>`;
}


/* ---------- 全局搜索（服务端权限过滤） ---------- */
const SEARCH_LABELS = {
  project: "项目", task: "任务", agent: "Agent", delivery: "交付",
  workflow: "工作流", knowledge: "知识", release: "发布",
};

async function renderSearchPage() {
  const el = $("#view");
  const q = (ROUTE.params && ROUTE.params.get("q")) || "";
  el.innerHTML = `
    <div class="page-head"><div><h2>全局搜索</h2>
      <p class="desc">服务端按可见项目过滤后再匹配，不会返回无权资源，也不通过结果数量泄露其他项目。</p></div></div>
    <form class="ws-searchbar" id="gs-form">
      <input id="gs-input" type="search" value="${esc(q)}" placeholder="搜索项目、任务、Agent、交付、工作流、知识、发布…" autocomplete="off">
      <button class="btn active" type="submit">搜索</button>
    </form>
    <div id="gs-body">${q ? emptyBox("搜索中…", "正在检索可见项目") : emptyBox("输入关键词", "按回车或点搜索；只检索你有权限的项目")}</div>`;
  $("#gs-form").onsubmit = (e) => {
    e.preventDefault();
    const v = $("#gs-input").value.trim();
    if (!v) return;
    navigate(`#/search?q=${encodeURIComponent(v)}`);
  };
  $("#gs-input").focus();
  if (!q) return;
  let data = null;
  try {
    data = await fetchJSON(`/api/search?q=${encodeURIComponent(q)}&limit=50`);
  } catch (e) {
    $("#gs-body").innerHTML = emptyBox("搜索失败", e.message || "请求未成功");
    return;
  }
  if (ROUTE.kind !== "search" || (ROUTE.params.get("q") || "") !== q) return; // 结果过期则丢弃
  const body = $("#gs-body");
  if (!body) return;
  if (!data.count) {
    body.innerHTML = emptyBox("没有匹配结果", `「${q}」在可见项目内无命中；数据缺失与无权是两件事，这里只会返回你可见的范围。`);
    return;
  }
  const groups = {};
  for (const r of data.results) (groups[r.type] = groups[r.type] || []).push(r);
  const sections = Object.keys(groups).map(type => `
    <section class="ws-panel"><h3>${esc(SEARCH_LABELS[type] || type)} · ${groups[type].length}</h3>
      <ul>${groups[type].map(r => `
        <li class="ws-row"><a class="ws-link" href="${esc(r.link)}">${esc(r.title || r.id)}</a>
          <span class="ws-tag">${esc(r.subtitle || "")}</span>
          <span class="ws-sub">${esc(r.project_code || "")}</span></li>`).join("")}</ul>
    </section>`).join("");
  body.innerHTML = `<div class="ws-note">「${esc(q)}」共 ${data.count} 条，检索范围：${(data.searched_projects || []).map(esc).join("、") || "无可见项目"}</div>${sections}`;
}

function renderWorkspacePage(kind) {
  const el = $("#view");
  const [title, desc] = WS_META[kind];
  el.innerHTML = `
    <div class="page-head"><div><h2>${esc(title)}</h2><p class="desc">${esc(desc)}</p></div>
      <button class="btn ghost" id="ws-refresh">刷新</button></div>
    <div id="ws-body">${wsStateBox(kind)}</div>`;
  $("#ws-refresh").onclick = async () => { await loadWorkspaceData(kind, true); paintWorkspace(kind); };
  const cached = WS[kind];
  if (cached) paintWorkspace(kind);
  loadWorkspaceData(kind).then(() => paintWorkspace(kind));
}

function paintWorkspace(kind) {
  const body = $("#ws-body");
  if (!body) return;
  const data = WS[kind];
  if (!data) { body.innerHTML = wsStateBox(kind); return; }
  if (kind === "work") body.innerHTML = workHTML(data);
  else if (kind === "portfolio") { body.innerHTML = portfolioHTML(data); bindPortfolioFilters(data); }
  else body.innerHTML = inboxHTML(data);
  if (kind === "inbox") {
    const badge = $("#nav-inbox-badge");
    if (badge) {
      const n = data.unread || 0;
      badge.textContent = n > 99 ? "99+" : String(n);
      badge.hidden = n === 0;
    }
    $$("[data-mark-read]").forEach(btn => {
      btn.onclick = async () => {
        await fetchJSON("/api/workspace/notifications/read", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ keys: [btn.dataset.markRead] }),
        });
        await loadWorkspaceData("inbox", true);
        paintWorkspace("inbox");
      };
    });
    const all = $("#ws-mark-all");
    if (all) all.onclick = async () => {
      const keys = (WS.inbox.items || []).filter(i => !i.read).map(i => i.key);
      if (!keys.length) return;
      await fetchJSON("/api/workspace/notifications/read", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ keys }),
      });
      await loadWorkspaceData("inbox", true);
      paintWorkspace("inbox");
    };
  }
}

function workHTML(d) {
  const c = d.counts || {};
  const rows = (items, empty) => items.length
    ? items.map(i => `<li class="ws-row">${i}</li>`).join("")
    : `<li class="ws-empty">${esc(empty)}</li>`;
  const taskRow = t => `<a class="ws-link" href="#/p/${encodeURIComponent(t.project_id)}/tasks">${esc(t.title)}</a>
      <span class="ws-tag">${esc(t.status)}</span><span class="ws-sub">${esc(t.project_code || "")} · ${esc(ago(t.updated_at))}</span>`;
  const apprRow = a => `<a class="ws-link" href="#/p/${encodeURIComponent(a.project_id)}/approvals">${esc(a.resource_type)} ${esc(a.resource_id)} · ${esc(a.action)}</a>
      <span class="ws-tag warn">待审批</span><span class="ws-sub">${esc(a.project_code || "")} · ${esc(ago(a.created_at))}</span>`;
  const delRow = x => `<a class="ws-link" href="#/p/${encodeURIComponent(x.project_id)}/deliveries">${esc(x.title)}</a>
      <span class="ws-tag">${esc(x.status)}</span><span class="ws-sub">${esc(x.project_code || "")} · ${esc(ago(x.created_at))}</span>`;
  const execRow = e => `<span class="ws-link">${esc(e.agent_id || "—")}</span>
      <span class="ws-tag ${e.status === "failed" ? "risk" : ""}">${esc(e.status || "—")}</span>
      <span class="ws-sub">${esc(e.project_code || "")} · ${esc(ago(e.started_at))}</span>`;
  return `
    <div class="ws-metrics">
      ${wsMetric("进行中/待验收任务", c.tasks ?? "—")}
      ${wsMetric("阻塞任务", c.blocked_tasks ?? "—", c.blocked_tasks ? "risk" : "")}
      ${wsMetric("待审批", c.approvals ?? "—", c.approvals ? "warn" : "")}
      ${wsMetric("待验收交付", c.deliveries ?? "—")}
    </div>
    <section class="ws-panel"><h3>我的任务</h3><ul>${rows(d.tasks.map(taskRow), "暂无进行中的任务")}</ul></section>
    <section class="ws-panel"><h3>待我审批</h3><ul>${rows(d.approvals.map(apprRow), "没有待审批事项")}</ul></section>
    <section class="ws-panel"><h3>待我验收的交付</h3><ul>${rows(d.deliveries.map(delRow), "没有待验收交付")}</ul></section>
    <section class="ws-panel"><h3>最近执行</h3><ul>${rows(d.executions.map(execRow), "暂无执行记录")}</ul></section>`;
}


function bindPortfolioFilters(d) {
  const params = ROUTE.params || new URLSearchParams();
  const riskSel = $("#pf-risk"), qSel = $("#pf-quality"), grid = $("#pf-grid"), counter = $("#pf-count");
  if (!grid) return;
  riskSel.value = params.get("risk") || "";
  qSel.value = params.get("quality") || "";
  const apply = () => {
    const next = new URLSearchParams();
    if (riskSel.value) next.set("risk", riskSel.value);
    if (qSel.value) next.set("quality", qSel.value);
    const qs = next.toString();
    history.replaceState(null, "", location.pathname + location.search + `#/portfolio${qs ? "?" + qs : ""}`);
    ROUTE.params = next;
    const shown = (d.projects || []).filter(x =>
      (!riskSel.value || x.risk === riskSel.value) &&
      (!qSel.value || x.data_quality === qSel.value));
    const pct = (o) => o.completion == null ? 0 : Math.round(o.completion * 100);
    grid.innerHTML = shown.map(p0 => {
      const t0 = p0.tasks || {};
      return `<article class="ws-proj" data-enter="1" data-pid="${esc(p0.id)}">
        <div class="ws-proj-head"><b>${esc(p0.name)}</b>${riskBadge(p0.risk)}</div>
        <div class="ws-proj-code">${esc(p0.code || "")} · ${esc(p0.status || "")}</div>
        <div class="ws-bar"><i style="width:${pct(t0)}%"></i></div>
        <div class="ws-proj-stats"><span>完成 ${t0.done ?? "—"}/${t0.total ?? "—"}</span>
          <span>阻塞 ${t0.blocked ?? "—"}</span><span>待验收 ${p0.pending_deliveries ?? "—"}</span>
          <span>待审批 ${p0.pending_approvals ?? "—"}</span></div>
        <div class="ws-sub">最近活动 ${p0.last_active_at ? esc(ago(p0.last_active_at)) : "无记录"}</div>
      </article>`;
    }).join("") || emptyBox("没有匹配的项目", "调整筛选条件试试");
    if (counter) counter.textContent = `显示 ${shown.length} / ${(d.projects || []).length}`;
  };
  riskSel.onchange = apply;
  qSel.onchange = apply;
  apply();
}

function portfolioHTML(d) {

    const t = p.tasks || {};
    const pct = t.completion == null ? null : Math.round(t.completion * 100);
    const reasons = (p.risk_reasons || []).length

      <div class="ws-proj-code">${esc(p.code || "")} · ${esc(p.status || "")}</div>
      <div class="ws-bar"><i style="width:${pct == null ? 0 : pct}%"></i></div>

        <span>完成 ${t.done ?? "—"}/${t.total ?? "—"}</span>
        <span>阻塞 ${t.blocked ?? "—"}</span>

          <option value="">全部</option>

      </label>
      <span class="ws-sub" id="pf-count"></span>
    </div>
    <div class="ws-grid" id="pf-grid"></div>`;

  const params = (ROUTE.params || new URLSearchParams());
  const risk = params.get("risk") || "";
  const quality = params.get("quality") || "";
  const all = d.projects || [];
  const shown = all.filter(x => (!risk || x.risk === risk) && (!quality || x.data_quality === quality));
  const cardHTML = (d0) => (d0.projects || []).map(p0 => {
    const t0 = p0.tasks || {};

    return `<article class="ws-proj" data-enter="1" data-pid="${esc(p0.id)}">
      <div class="ws-proj-head"><b>${esc(p0.name)}</b>${riskBadge(p0.risk)}</div>
      <div class="ws-proj-code">${esc(p0.code || "")} · ${esc(p0.status || "")}</div>
      <div class="ws-bar"><i style="width:${pct0 == null ? 0 : pct0}%"></i></div>
      <div class="ws-proj-stats">
        <span>完成 ${t0.done ?? "—"}/${t0.total ?? "—"}</span>
        <span>阻塞 ${t0.blocked ?? "—"}</span>
        <span>待验收 ${p0.pending_deliveries ?? "—"}</span>
        <span>待审批 ${p0.pending_approvals ?? "—"}</span>

function renderPlatform(mode = ROUTE.kind) {
  if (mode === "work" || mode === "portfolio" || mode === "inbox") {
    renderWorkspacePage(mode);
    return;
  }
  if (mode === "search") { renderSearchPage(); return; }
  const n = platformNumbers();
  const base = APP.projects.filter(p => matchesProject(p) && matchesProjectQuery(p));
  let list = base;
  if (mode === "favorites") list = base.filter(p => isFavorite(p.id));
  if (mode === "recent") {
    const ids = APP.recentIds || readIdList(RECENT_KEY);
    list = ids.map(id => base.find(p => String(p.id) === id)).filter(Boolean);
  }
  const HEAD = {
    platform: ["平台总览", "跨项目查看 Agent 运行、任务进度、24 小时 Token 与花费。数字缺失时显示 —。"],
    projects: ["全部项目", "统一查看和管理你有权限访问的 Agent 项目。"],
    favorites: ["我的收藏", "收藏同步到平台（PUT /favorite）；接口不可用时回退本机 localStorage。"],
    recent: ["最近访问", "最近打开的 8 个项目，来自平台最近访问记录。"],
  };
  const [title, desc] = HEAD[mode] || HEAD.platform;
  const cards = list.map(p => {
    const st = p.stats || {};
    const agents = st.agent_total == null ? "—" : st.agent_total;
    const doing = st.task_in_progress == null ? "—" : st.task_in_progress;
    const blocked = st.task_blocked == null ? "—" : st.task_blocked;
    const tokens = st.token_24h == null ? "—" : fmtNum(st.token_24h);
    return `<article class="proj-card" role="button" tabindex="0" data-enter="1" data-pid="${esc(p.id)}" aria-label="进入项目 ${esc(p.name)}">
      <div class="pc-head"><span class="pc-name">${esc(p.name)}</span>${statusBadge(p.status)}</div>
      <div class="pc-code">${esc(p.code)}</div>
      <div class="pc-desc">${esc(p.description || "—")}</div>
      <div class="pc-stats">
        <span>Agent <b>${esc(String(agents))}</b></span>
        <span>进行中 <b>${esc(String(doing))}</b></span>
        <span>阻塞 <b>${esc(String(blocked))}</b></span>
        <span>24h Token <b>${esc(String(tokens))}</b></span>
      </div>
      <div class="pc-foot"><span>最近更新 ${esc(ago(p.updated_at))}</span><span class="pc-enter">进入 →</span></div>
    </article>`;
  }).join("");

  const events = APP.overview?.recent_events || [];
  const evHtml = events.length ? events.slice(0, 20).map(e => `
    <div class="ev">
      <span class="at">${esc(fmtTime(e.at))}</span>
      <span class="msg">${esc(e.message || "—")}</span>
      <span class="proj">${esc(e.project_name || e.project_id || "")}</span>
    </div>`).join("") : `<div class="empty">暂无最近动态</div>`;

        <div class="kpi"><div class="label">进行中任务</div><div class="value">${esc(String(n.task_in_progress ?? "—"))}</div><div class="hint">跨项目汇总</div></div>
        <div class="kpi ${n.task_blocked ? "err" : ""}"><div class="label">阻塞任务</div><div class="value">${esc(String(n.task_blocked ?? "—"))}</div><div class="hint">需要关注</div></div>

        <div class="kpi" title="近 24h 有活动的 ccusage 会话成本，近似值"><div class="label">近 24h 花费</div>

      </div>
      ${APP.overviewErr ? `<div class="banner warn"><b>平台聚合不可用</b><span class="grow">${esc(APP.overviewErr.message)}，已按项目统计降级汇总。</span></div>` : ""}
    </section>` : ""}
    <section>
      <div class="sec-head"><h2>${mode === "platform" ? "全部项目" : esc(title)}</h2><span class="desc">选择一个项目进入工作区</span><span class="count">${list.length} / ${APP.projects.length}</span></div>
      ${list.length ? `<div class="proj-grid">${cards}</div>` : emptyBox(emptyTitle, emptyDesc)}
    </section>
    ${mode === "platform" ? `<section>
      <div class="sec-head"><h2>最近动态</h2><span class="desc">来自项目事件流</span></div>
      <div class="panel">${evHtml}</div>

  bindEnterables();
}

function bindEnterables() {
  $$("#view [data-enter]").forEach(el => {
    const enter = () => {
      if (el.dataset.pid) {
        const p = resolveProject(el.dataset.pid);
        if (p) { navigate(projectHash(p, "overview")); closeMobileSidebar(); }
      }
    };
    el.onclick = enter;
    el.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); enter(); } };
  });
}

/* ---------- 项目外壳 ---------- */
function renderProject() {
  const p = APP.currentProject;
  if (!p) return;
  const st = p.stats || {};
  const tabs = TAB_KEYS.map(k => `<a class="tab ${ROUTE.tab === k ? "active" : ""}" role="tab" aria-selected="${ROUTE.tab === k}" href="${projectHash(p, k)}">${esc(TAB_LABEL[k])}</a>`).join("");
  const fav = isFavorite(p.id);
  const color = projectColor(p);
  const archived = isArchivedProject(p) || isArchivedProject(APP.projectDetail);
  const heroStatus = isArchivedProject(p) ? p.status
    : (APP.projectDetail && String(APP.projectDetail.id) === String(p.id) ? APP.projectDetail.status : p.status);
  const archBanner = archived ? `<div class="banner warn archived-banner" data-testid="archived-banner" role="status">
      <b>已归档</b><span class="grow">项目处于归档状态，所有写操作（任务、交付验收、设置保存）已禁用，数据保持只读。</span>
      <button class="btn sm" id="btn-restore-inline" data-testid="restore-project">恢复项目</button>
    </div>` : "";
  $("#view").innerHTML = `
    ${archBanner}
    <div class="proj-hero">
      <div class="proj-hero-icon" style="--pc:${esc(color)}" aria-hidden="true">${esc(projectInitial(p))}</div>
      <div class="proj-hero-main">
        <div class="proj-title"><h2>${esc(p.name)}</h2>${statusBadge(heroStatus)}<span class="chip-code">${esc(p.code)}</span></div>
        <div class="proj-sub"><span>${esc(p.description || "—")}</span></div>
        <div class="proj-meta">
          ${p.repo_root ? `<span>仓库 <code>${esc(p.repo_root)}</code></span>` : ""}
          <span>Agent ${esc(String(st.agent_total ?? "—"))}</span>
          <span>最近更新 ${esc(ago(p.updated_at))}</span>
        </div>
      </div>
      <div class="proj-hero-actions">
        <button class="btn ${fav ? "active" : ""}" id="btn-fav" aria-pressed="${fav}">${fav ? "★ 已收藏" : "☆ 收藏"}</button>
        <button class="btn" id="btn-share">分享</button>
        <a class="btn" href="${projectHash(p, "settings")}" title="更多设置">…</a>
        <button class="btn" onclick="manualRefresh()" title="刷新当前项目">↻</button>
      </div>
    </div>
    <div class="tabs" role="tablist" aria-label="项目页面">${tabs}</div>
    <div id="tab-content"></div>`;
  $("#btn-fav").onclick = () => toggleFavorite(p.id);
  const restoreBtn = $("#btn-restore-inline");
  if (restoreBtn) restoreBtn.onclick = () => restoreProject();
  $("#btn-share").onclick = async () => {
    const b = $("#btn-share");
    try {
      await navigator.clipboard.writeText(location.href);
      b.textContent = "已复制";
    } catch { b.textContent = "请复制地址栏"; }
    setTimeout(() => { if (b.isConnected) b.textContent = "分享"; }, 1800);
  };
  renderProjectContent();
}

function syncFavoriteButton() {
  const b = $("#btn-fav");
  const p = APP.currentProject;
  if (!b || !p) return;
  const fav = isFavorite(p.id);
  b.classList.toggle("active", fav);
  b.setAttribute("aria-pressed", String(fav));
  b.textContent = fav ? "★ 已收藏" : "☆ 收藏";
}

/* ---------- 第四期：智能层（评估 / 知识 / 工作流 / 发布 / 改进 / 价值 / 自主 / 目录） ---------- */
const P4_TABS = [
  ["eval", "评估"], ["knowledge", "知识"], ["workflow", "工作流"], ["release", "发布"],
  ["improvement", "改进"], ["outcome", "价值"], ["autonomy", "自主化"], ["catalog", "目录"],
];

function p4Base() {
  const p = APP.currentProject;
  return p ? `/api/projects/${encodeURIComponent(p.id)}` : null;
}

function p4Empty(text) {
  return `<div class="empty">${esc(text)}</div>`;
}

function p4Table(headers, rows) {
  if (!rows.length) return p4Empty("暂无数据");
  return `<div class="table-wrap"><table><thead><tr>${headers.map(h => `<th>${esc(h)}</th>`).join("")}</tr></thead>`
    + `<tbody>${rows.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}

function p4Badge(status) {
  return `<span class="chip" data-status="${esc(status || "")}">${esc(status || "-")}</span>`;
}

function renderP4Page(el) {
  const base = p4Base();
  if (!base) { el.innerHTML = errorBox(new Error("未选择项目")); return; }
  if (!APP.p4Tab) APP.p4Tab = "eval";

  const nav = P4_TABS.map(([key, label]) =>
    `<a class="tab ${APP.p4Tab === key ? "active" : ""}" href="javascript:void 0" data-p4="${key}">${esc(label)}</a>`
  ).join("");

  el.innerHTML = `<div class="p4-wrap">
    <div class="tabs p4-tabs" role="tablist">${nav}</div>
    <div id="p4-body">${skeletonBox(160)}</div>
  </div>`;

  el.querySelectorAll("[data-p4]").forEach(node => {
    node.onclick = () => { APP.p4Tab = node.dataset.p4; renderP4Page(el); };
  });
  loadP4Panel(base);
}

async function loadP4Panel(base) {
  const body = $("#p4-body");
  if (!body) return;
  const kind = APP.p4Tab;
  const safe = (p) => p.catch(() => ({ items: [], total: 0 }));
  try {
    if (kind === "eval") {
      const [suites, datasets, runs] = await Promise.all([
        safe(fetchJSON(`${base}/eval/suites`)),
        safe(fetchJSON(`${base}/eval/datasets`)),
        safe(fetchJSON(`${base}/eval/runs`)),
      ]);
      body.innerHTML = `
        <div class="panel"><div class="panel-head"><h3>评估运行</h3></div><div class="panel-body">
        ${p4Table(["运行", "状态", "决策", "样本", "安全违规", "分数"], (runs.items || []).map(r => [
          `<code>${esc(r.id)}</code>`, p4Badge(r.status), p4Badge(r.decision),
          `${r.passed_cases}/${r.executed_cases}（跳过 ${r.skipped_cases}）`,
          String(r.safety_violations), r.score == null ? "—" : Number(r.score).toFixed(3),
        ]))}</div></div>
        <div class="two-col">
          <div class="panel"><div class="panel-head"><h3>套件 ${suites.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["名称", "创建"], (suites.items || []).map(r => [esc(r.name), esc(r.created_at)]))}</div></div>
          <div class="panel"><div class="panel-head"><h3>数据集 ${datasets.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["名称", "划分", "最新版本"], (datasets.items || []).map(r => [
            esc(r.name), p4Badge(r.split), String(r.latest_version ?? "—")]))}</div></div>
        </div>`;
    } else if (kind === "knowledge") {
      const [sources, items] = await Promise.all([
        safe(fetchJSON(`${base}/knowledge/sources`)),
        safe(fetchJSON(`${base}/knowledge/items`)),
      ]);
      body.innerHTML = `
        <div class="panel"><div class="panel-head"><h3>新建知识（保存即发布）</h3></div><div class="panel-body">
          <input id="p4-kn-title" placeholder="标题，例如：上线检查清单" style="width:100%;margin-bottom:8px" />
          <textarea id="p4-kn-content" placeholder="内容（命中 Secret 会被拒绝入库）" rows="4" style="width:100%;margin-bottom:8px"></textarea>
          <div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
            <select id="p4-kn-class">
              <option value="Internal">Internal</option>
              <option value="Public">Public</option>
              <option value="Confidential">Confidential（需先登记许可）</option>
            </select>
            <select id="p4-kn-license">
              <option value="">无许可</option>
              <option value="internal-only">internal-only</option>
            </select>
            <button class="btn" id="p4-kn-save">保存并发布</button>
            <span id="p4-kn-msg" class="muted"></span>
          </div>
        </div></div>
        <div class="panel"><div class="panel-head"><h3>检索（项目内）</h3></div><div class="panel-body">
          <div style="display:flex;gap:8px;margin-bottom:10px">
            <input id="p4-kn-q" placeholder="输入关键词，例如 pytest" style="flex:1" />
            <button class="btn" id="p4-kn-go">检索</button>
          </div>
          <div id="p4-kn-result" class="muted">未检索</div>
        </div></div>
        <div class="two-col">
          <div class="panel"><div class="panel-head"><h3>来源 ${sources.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["标题", "类型", "密级"], (sources.items || []).map(r => [
            esc(r.title), esc(r.kind), p4Badge(r.classification)]))}</div></div>
          <div class="panel"><div class="panel-head"><h3>条目 ${items.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["标题", "状态"], (items.items || []).map(r => [esc(r.title), p4Badge(r.status)]))}</div></div>
        </div>`;
      $("#p4-kn-save").onclick = async () => {
        const msg = $("#p4-kn-msg");

        const classification = $("#p4-kn-class").value;
