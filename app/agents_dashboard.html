function findTask(taskId) {
  const t = (APP.state?.tasks || []).find(x => x.id === taskId);
  if (t) return t;
  const fromKanban = (APP.state?.kanban || [])
    .flatMap(c => c.tasks || [])
    .find(x => x.id === taskId);
  if (fromKanban) return fromKanban;
  const fb = (APP.tasksFallback?.items || []).find(x => (x.task_key || x.task_id || x.id) === taskId);
  if (!fb) return null;
  return {
    id: taskId, title: fb.title || fb.name || "—", priority: fb.priority || "P2",
    status: fb.status || "—", owner: fb.owner || "—", depends: fb.depends || "—", qa: fb.qa || "—",
    commits: fb.commits || [], reports: fb.reports || [],
  };
}

/* ---------- 实时执行流 ---------- */
const traceEl = $("#trace"), traceBody = $("#trace-body");
let traceTimer = null;

function stopTrace() {
  if (traceTimer) { clearInterval(traceTimer); traceTimer = null; }
  traceEl.classList.remove("show"); traceEl.setAttribute("aria-hidden", "true");
  APP.traceAgentId = null; APP.traceProjectId = null;
  if (!drawer.classList.contains("show") && !modal.classList.contains("show")) mask.classList.remove("show");
}
$("#trace-close").onclick = () => { stopTrace(); restoreFocus(); };

function renderTrace(d) {
  const running = d.status === "running";
  $("#trace-dot").className = "dot " + d.status;
  $("#trace-title").textContent = d.description || d.agent_type || "执行流";
  $("#trace-badge").innerHTML = running
    ? `<span class="live-badge"><span class="pulse"></span>实时</span>`
    : `<span class="chip">${esc(d.status_text || "—")}</span>`;
  $("#trace-meta").innerHTML = `
    <span>状态 <b>${esc(d.status_text || "—")}</b></span>
    <span>事件 <b>${esc(String(d.events_total ?? "—"))}</b>${d.truncated ? "（仅最近 160 条）" : ""}</span>
    <span>输出 <b>${fmtNum(d.tokens)}</b> tok</span>
    ${d.model ? `<span>模型 <b>${esc(d.model)}</b></span>` : ""}
    <span>最后活动 <b>${ago(d.last_event_at)}</b></span>`;
  const nearBottom = traceBody.scrollHeight - traceBody.scrollTop - traceBody.clientHeight < 160;
  traceBody.innerHTML = (d.events || []).map(e => {
    if (e.kind === "thinking") return `<div class="tl thinking"><div class="line">
      <span class="detail">思考：${esc(e.text)}</span><span class="at">${fmtTime(e.at)}</span></div></div>`;
    if (e.kind === "text") return `<div class="tl text"><div class="line">
      <span class="detail">${esc(e.text)}</span><span class="at">${fmtTime(e.at)}</span></div></div>`;
    if (e.kind === "tool") return `<div class="tl tool"><div class="line">
      <span class="tool-tag">${esc(e.tool)}</span><span class="detail">${esc(e.detail || "")}</span>
      <span class="at">${fmtTime(e.at)}</span></div>
      ${e.result != null ? `<pre class="pre ${e.ok === false ? "err" : ""}">${esc(e.result)}</pre>` : ""}</div>`;
    return `<div class="tl"><div class="line"><span class="detail">${esc(e.text || "")}</span></div></div>`;
  }).join("") || `<div class="empty">该 agent 还没有事件</div>`;
  if (nearBottom || traceBody.dataset.fresh === "1") {
    traceBody.scrollTop = traceBody.scrollHeight; traceBody.dataset.fresh = "0";
  }
}

async function loadTrace(agentId) {
  if (!agentId || APP.traceAgentId !== agentId) return;
  try {
    const res = await apiFetch(`/api/agent/${encodeURIComponent(agentId)}`, { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const d = await res.json();
    if (!d.ok) throw new Error(d.error || "读取失败");
    if (APP.traceAgentId !== agentId) return;
    renderTrace(d);
    if (d.status !== "running" && traceTimer) { clearInterval(traceTimer); traceTimer = null; }
  } catch (e) {
    if (APP.traceAgentId !== agentId) return;
    traceBody.innerHTML = `<div class="banner">读取失败：${esc(e.message)}</div>`;
  }
}

function openTrace(agentId) {
  if (!agentId) return;
  const projectId = APP.currentProject?.id || "";
  if (APP.traceAgentId === agentId && traceEl.classList.contains("show")) return;
  rememberFocus();
  if (traceTimer) { clearInterval(traceTimer); traceTimer = null; }
  APP.traceAgentId = agentId;
  APP.traceProjectId = projectId;
  traceBody.dataset.fresh = "1";
  traceBody.innerHTML = `<div class="skeleton" style="height:70px"></div>`;
  $("#trace-title").textContent = "执行流";
  $("#trace-badge").innerHTML = "";
  mask.classList.add("show");
  traceEl.classList.add("show"); traceEl.setAttribute("aria-hidden", "false");
  loadTrace(agentId);
  traceTimer = setInterval(() => {
    if (APP.paused || document.hidden) return;
    if (!APP.traceAgentId || APP.traceProjectId !== (APP.currentProject?.id || "")) { stopTrace(); return; }
    loadTrace(agentId);
  }, 1500);
  $("#trace-close").focus();
}

/* ---------- 本地文件 ---------- */
async function openFile(path) {
  if (!path) return;
  rememberFocus();
  const pid = APP.currentProject?.id;
  const qs = `path=${encodeURIComponent(path)}${pid ? `&project=${encodeURIComponent(pid)}` : ""}`;
  const url = `/api/file?${qs}`;
  const viewUrl = `/view?${qs}`;
  $("#modal-title").textContent = path.split("/").pop();
  $("#modal-body").innerHTML = `<div class="skeleton" style="height:140px"></div>`;
  mask.classList.add("show"); modal.classList.add("show");
  $("#modal-close").focus();
  const isText = /\.(md|txt|json|csv|log)$/i.test(path);
  const isImage = /\.(png|jpe?g|svg)$/i.test(path);
  const isHtml = /\.html?$/i.test(path);
  let preview;
  if (isImage) preview = `<img src="${url}" style="max-width:100%;border-radius:8px" alt="${esc(path.split("/").pop())}">`;
  else if (isHtml) preview = `<iframe src="${url}" style="width:100%;height:50vh;border:1px solid var(--line);border-radius:8px;background:#fff" title="文件预览"></iframe>`;
  else if (isText) {
    try {
      const text = await (await apiFetch(url)).text();
      preview = `<pre class="pre" style="max-height:50vh">${esc(text.slice(0, 20000))}${text.length > 20000 ? "\n…（已截断）" : ""}</pre>`;
    } catch { preview = `<div class="banner">读取失败</div>`; }
  } else preview = `<div class="mono">该类型不支持内嵌预览，请用默认程序打开</div>`;
  $("#modal-body").innerHTML = `
    <div class="kv"><span class="k">路径</span><span class="v mono">${esc(path)}</span></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="btn-open-os">用默认程序打开</button>
      <a class="btn" href="${viewUrl}" target="_blank" rel="noopener noreferrer" style="text-decoration:none" title="在独立查看页打开，不依赖脚本弹窗">新标签页查看</a>
    </div>
    ${preview}`;
  const btn = $("#btn-open-os");
  btn.onclick = async () => {
    btn.textContent = "打开中…";
    try {
      const r = await apiFetch(`/api/open?${qs}`, { method: "POST" });
      const d = await r.json();
      btn.textContent = d.ok ? "已交给系统打开" : "打开失败（仅本机可用）";
    } catch { btn.textContent = "打开失败"; }
    setTimeout(() => { btn.textContent = "用默认程序打开"; }, 2500);
  };
}

/* ---------- 新建项目 ---------- */
const WIZ = { step: 1, form: {}, templates: null, templateKey: "", err: "" };

function openCreateProject() {
  WIZ.step = 1; WIZ.form = { name: "", code: "", description: "", repo_root: "" };
  WIZ.templates = null; WIZ.templateKey = ""; WIZ.err = "";
  rememberFocus();
  mask.classList.add("show"); modal.classList.add("show");
  renderWizard();
}

function wizSteps() {
  return ["项目信息", "Agent 团队", "确认初始化"];
}

function renderWizard() {
  $("#modal-title").textContent = "创建项目";
  const steps = wizSteps().map((label, idx) => {
    const n = idx + 1;
    const cls = n === WIZ.step ? "on" : (n < WIZ.step ? "done" : "");
    return `<span class="wz-step ${cls}"><i>${n}</i>${esc(label)}</span>`;
  }).join("");
  const f = WIZ.form;
  let body = "";
  let nextLabel = "下一步";
  if (WIZ.step === 1) {
    body = `
      <div class="field"><label for="cp-name">项目名称 *</label>
        <input id="cp-name" name="name" maxlength="60" value="${esc(f.name)}" placeholder="例如：具身智能数据闭环平台" autocomplete="off"></div>
      <div class="field"><label for="cp-code">项目代号 *</label>
        <input id="cp-code" name="code" maxlength="24" value="${esc(f.code)}" placeholder="例如：material" autocomplete="off">
        <span class="hint" style="font-size:11.5px">2–24 位字母、数字或短横线，创建后作为项目主键的一部分。</span></div>
      <div class="field"><label for="cp-desc">项目描述</label>
        <textarea id="cp-desc" name="description" maxlength="500" placeholder="简要描述项目目标和范围">${esc(f.description)}</textarea></div>
      <div class="field"><label for="cp-repo">项目仓库路径（可选）</label>
        <input id="cp-repo" name="repo_root" maxlength="512" value="${esc(f.repo_root)}" placeholder="例如：/Users/you/work/my-project；留空则使用平台独立空工作区" autocomplete="off"></div>`;
  } else if (WIZ.step === 2) {
    const list = WIZ.templates;
    if (!list) {
      body = emptyBox("加载模板…", "正在读取团队模板");
    } else {
      body = `<p class="hint" style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">选择 Agent 团队模板；模板只做初始化建议，不会静默创建外部资源。</p>
        <div class="wz-templates">${list.map(t => {
          const on = WIZ.templateKey === t.key;
          return `<label class="wz-tpl ${on ? "on" : ""}">
            <input type="radio" name="wz-tpl" value="${esc(t.key)}" ${on ? "checked" : ""}>
            <span><b>${esc(t.name || t.key)}</b><em>${esc((t.roles || []).length)} 个角色 · v${esc(String(t.version || 1))}</em></span>
          </label>`;
        }).join("") || emptyBox("暂无模板", "平台没有可用的团队模板")}</div>
        <label class="wz-tpl ${WIZ.templateKey === "" ? "on" : ""}" style="margin-top:8px">
          <input type="radio" name="wz-tpl" value="" ${WIZ.templateKey === "" ? "checked" : ""}>
          <span><b>暂不初始化团队</b><em>稍后可在项目设置里应用模板</em></span>
        </label>`;
    }
  } else {
    const tpl = (WIZ.templates || []).find(t => t.key === WIZ.templateKey);
    body = `<div class="kv wz-summary">
        <span class="k">项目名称</span><span class="v">${esc(f.name)}</span>
        <span class="k">项目代号</span><span class="v mono">${esc(f.code)}</span>
        <span class="k">描述</span><span class="v">${esc(f.description || "—")}</span>
        <span class="k">仓库路径</span><span class="v mono">${esc(f.repo_root || "平台独立空工作区")}</span>
        <span class="k">Agent 团队</span><span class="v">${tpl ? esc(tpl.name || tpl.key) + `（${(tpl.roles || []).length} 个角色）` : "暂不初始化"}</span>
      </div>
      <p class="hint" style="margin:8px 0 0;font-size:12px;color:var(--muted)">确认后调用既有项目创建与团队模板接口；结果会写入审计，不会创建任何未经授权的资源。</p>`;
    nextLabel = "创建项目";
  }
  const err = WIZ.err ? `<div class="form-err" role="alert">${esc(WIZ.err)}</div>` : "";
  $("#modal-body").innerHTML = `
    <div class="wz-steps">${steps}</div>
    <form id="wz-form" novalidate>${body}${err}
      <div class="form-actions">
        <button type="button" class="btn" id="wz-cancel">取消</button>
        ${WIZ.step > 1 ? `<button type="button" class="btn" id="wz-prev">上一步</button>` : ""}
        <button type="submit" class="btn active" id="wz-next">${nextLabel}</button>
      </div>
    </form>`;
  if ($("#cp-name")) $("#cp-name").focus();
  $("#wz-cancel").onclick = closeAll;
  if ($("#wz-prev")) $("#wz-prev").onclick = () => { WIZ.step -= 1; WIZ.err = ""; renderWizard(); };
  $$('input[name="wz-tpl"]').forEach(r => {
    r.onchange = () => {
      WIZ.templateKey = r.value;
      // 只切换高亮，不重渲染整棵 DOM：重渲染会让浏览器焦点与自动化点击抖动
      $$(".wz-tpl").forEach(el => {
        const input = el.querySelector('input[name="wz-tpl"]');
        el.classList.toggle("on", Boolean(input && input.checked));
      });
    };
  });
  $("#wz-form").onsubmit = (e) => { e.preventDefault(); wizNext(); };
  if (WIZ.step === 2 && !WIZ.templates) loadWizardTemplates();
}

async function loadWizardTemplates() {
  try {
    const d = await fetchJSON("/api/team-templates");
    WIZ.templates = d.items || [];
  } catch (e) {
    WIZ.templates = [];
    WIZ.err = `模板加载失败：${e.message || "未知错误"}`;
  }
  if (WIZ.step === 2) renderWizard();
}

async function wizNext() {
  WIZ.err = "";
  const f = WIZ.form;
  if (WIZ.step === 1) {
    f.name = $("#cp-name").value.trim();
    f.code = $("#cp-code").value.trim();
    f.description = $("#cp-desc").value.trim();
    f.repo_root = $("#cp-repo").value.trim();
    if (f.name.length < 2 || f.name.length > 60) { WIZ.err = "项目名称需为 2–60 个字符"; return renderWizard(); }
    if (!/^[A-Za-z0-9-]{2,24}$/.test(f.code)) { WIZ.err = "项目代号需为 2–24 位字母、数字或短横线"; return renderWizard(); }
    if (f.description.length > 500) { WIZ.err = "项目描述最多 500 字"; return renderWizard(); }
    if (f.repo_root.length > 512) { WIZ.err = "项目仓库路径最多 512 个字符"; return renderWizard(); }
    WIZ.step = 2; return renderWizard();
  }
  if (WIZ.step === 2) { WIZ.step = 3; return renderWizard(); }

  const btn = $("#wz-next");
  btn.disabled = true; btn.textContent = "创建中…";
  try {
    const d = await fetchJSON("/api/projects", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: f.code, name: f.name, description: f.description, repo_root: f.repo_root }),
    });
    const created = d?.project || null;
    let teamInfo = "";
    if (created && WIZ.templateKey) {
      try {
        const applied = await fetchJSON(`/api/projects/${encodeURIComponent(created.id)}/team/apply`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ template_key: WIZ.templateKey }),
        });
        const n = applied?.created ?? applied?.applied ?? null;
        teamInfo = n == null ? "团队模板已应用" : `团队模板已应用（新增 ${n} 个 Agent）`;
      } catch (e) {
        teamInfo = `项目已创建，但团队模板应用失败：${e.message || "未知错误"}`;
      }
    }
    closeAll();
    await ensureProjects(true);
    let target = created ? resolveProject(created.id) : null;
    if (!target && created) { APP.projects = APP.projects.concat([created]); target = created; }
    if (!target) target = resolveProject(f.code) || APP.projects[0];
    if (target) navigate(projectHash(target, "overview"));
    else navigate("#/");
    if (teamInfo) setTimeout(() => openInfoModal("初始化结果", `<p class="hint" style="margin:0">${esc(teamInfo)}</p>`), 300);
  } catch (err) {
    const codeErr = err.body?.error || "";
    if (err.status === 409 || codeErr === "project_code_exists") WIZ.err = "项目代号已存在，请更换";
    else if (err.status === 422 || codeErr === "invalid_project_code") WIZ.err = "项目代号不合法（2–24 位字母、数字或短横线）";
    else if (err.status === 404 || err.status === 405) WIZ.err = "后端未提供创建项目接口（/api/projects）";
    else WIZ.err = `创建失败：${err.message}`;
    renderWizard();
  }
}


/* ---------- 表格列宽拖拽（统一实现） ---------- */
const RESIZABLE_TABLES = ["wt", "deliveries", "docs-table", "reports"];

function readColWidths(key) {
  try {
    const v = JSON.parse(safeGet(key) || "null");
    return Array.isArray(v) && v.length && v.every(n => typeof n === "number" && n > 0) ? v : null;
  } catch { return null; }
}

function applyColWidths(table, cols, widths) {
  const total = widths.reduce((a, b) => a + b, 0);
  cols.forEach((c, i) => { c.style.width = `${Math.round(widths[i])}px`; });
  if (total > 0) table.style.width = `${Math.round(total)}px`;
}

function setupColumnResize(table, id) {
  const ths = Array.from(table.querySelectorAll("thead th"));
  const cols = Array.from(table.querySelectorAll("colgroup col"));
  if (!ths.length || ths.length !== cols.length) return;
  const storageKey = `agws-colw:${id}`;
  const saved = readColWidths(storageKey);
  if (saved && saved.length === cols.length) applyColWidths(table, cols, saved);

  const reset = () => {
    try { localStorage.removeItem(storageKey); } catch {}
    cols.forEach(c => { c.style.width = ""; });
    table.style.width = "";
  };

  ths.forEach((th, index) => {
    const handle = document.createElement("span");
    handle.className = "col-resizer";
    handle.title = "拖动调整列宽，双击恢复默认";
    handle.setAttribute("aria-hidden", "true");
    handle.addEventListener("dblclick", (e) => { e.preventDefault(); e.stopPropagation(); reset(); });
    handle.addEventListener("mousedown", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const widths = ths.map(t => t.getBoundingClientRect().width);
      const startX = e.clientX;
      const startW = widths[index];
      handle.classList.add("active");
      document.body.classList.add("col-resizing");
      const move = (ev) => {
        const next = widths.slice();
        next[index] = Math.max(48, startW + (ev.clientX - startX));
        applyColWidths(table, cols, next);
      };
      const up = () => {
        document.removeEventListener("mousemove", move);
        document.removeEventListener("mouseup", up);
        handle.classList.remove("active");
        document.body.classList.remove("col-resizing");
        const final = ths.map(t => Math.round(t.getBoundingClientRect().width));
        try { localStorage.setItem(storageKey, JSON.stringify(final)); } catch {}
      };
      document.addEventListener("mousemove", move);
      document.addEventListener("mouseup", up);
    });
    th.appendChild(handle);
  });
}

function initColumnResizers() {
  for (const id of RESIZABLE_TABLES) {
    const table = document.getElementById(id);
    if (!table || table.dataset.colResizeReady === "1") continue;
    table.dataset.colResizeReady = "1";
    setupColumnResize(table, id);
  }
}

function auditState() {
  if (!APP.audit) {
    APP.audit = {
      items: [], total: 0, page: 1, pageSize: 20, loading: false, error: null, loaded: false,
      filters: { project: "", action: "", from: "", to: "" },
    };
  }
  return APP.audit;
}

async function loadAudit() {
  const a = auditState();
  if (a.loading) return;
  a.loading = true;
  a.error = null;
  if (ROUTE.kind === "audit") renderAuditPage();
  const qs = new URLSearchParams({ page: String(a.page), page_size: String(a.pageSize) });
  for (const [k, v] of Object.entries(a.filters)) if (v) qs.set(k, v);
  try {
    const d = await fetchJSON(`/api/audit-logs?${qs.toString()}`);
    a.items = Array.isArray(d?.items) ? d.items : [];
    a.total = d?.total ?? a.items.length;
  } catch (e) {
    a.error = e;
    a.items = [];
    a.total = 0;
  } finally {
    a.loading = false;
    a.loaded = true;
    if (ROUTE.kind === "audit") renderAuditPage();
  }
}

function renderAuditPage() {

  }).join("");

  $("#view").innerHTML = `
    <div class="page-head">
      <div><h2>审计日志</h2><p class="desc">平台写操作只追加记录：项目、模板、任务、交付验收。</p></div>

      <div class="panel panel-pad">
        <div class="audit-filters">
          <div class="field"><label for="audit-project">项目</label><select id="audit-project">${projectOpts}</select></div>
          <div class="field"><label for="audit-action">动作</label>
            <input id="audit-action" list="audit-actions" value="${esc(a.filters.action)}" placeholder="全部动作" autocomplete="off">
            <datalist id="audit-actions">${actions.filter(Boolean).map(x => `<option value="${esc(x)}"></option>`).join("")}</datalist></div>
          <div class="field"><label for="audit-from">开始日期</label><input id="audit-from" type="date" value="${esc(a.filters.from)}"></div>
          <div class="field"><label for="audit-to">结束日期</label><input id="audit-to" type="date" value="${esc(a.filters.to)}"></div>
          <div class="inline-actions" style="padding-bottom:2px">
            <button class="btn primary" id="audit-query">查询</button>
            <button class="btn" id="audit-reset">重置</button>
          </div>
        </div>
      </div>
      ${a.error ? `<div class="banner" role="alert" data-testid="audit-error"><span class="grow">审计接口不可用：${esc(errText(a.error))}</span>

      <div class="panel">
        <table id="audit-table" data-testid="audit-table">

          <thead><tr><th>时间</th><th>项目</th><th>动作</th><th>资源</th><th>结果</th><th>操作人</th></tr></thead>
          <tbody>${a.loading
            ? `<tr><td colspan="6"><div class="skeleton" style="height:120px"></div></td></tr>`
            : rows || `<tr><td colspan="6" class="empty">${a.error ? "审计接口未就绪" : "暂无审计记录"}</td></tr>`}</tbody>

async function loadOverview() {

  } catch (e) {

function mergeProjectFromState(project, state) {
  const p = APP.projects.find(x => String(x.id) === String(project.id));
  if (!p) return;
  if (state.project) {
    if (state.project.name) p.name = state.project.name;
    if (state.project.code) p.code = state.project.code;
    if (state.project.status) p.status = state.project.status;
    if (state.project.repo_root != null) p.repo_root = state.project.repo_root;
  }
  const roster = state.roster || [];
  const funnel = funnelCounts(state.kanban);
  p.stats = { ...(p.stats || {}) };
  if (state.stats?.agents_total != null) p.stats.agent_total = state.stats.agents_total;
  if (roster.length) p.stats.agent_active = agentCounts(roster).running;
  if (state.stats?.tasks_in_progress != null) p.stats.task_in_progress = state.stats.tasks_in_progress;
  if (funnel) { p.stats.task_todo = funnel.todo; p.stats.task_blocked = funnel.blocked; }
  if (state.project_usage) {
    if (state.project_usage.token_24h != null) p.stats.token_24h = state.project_usage.token_24h;
    if (state.project_usage.cost_24h != null) p.stats.cost_24h = state.project_usage.cost_24h;
  } else if (state.usage?.total_tokens != null) {
    p.stats.token_24h = state.usage.total_tokens;
  }
  p.updated_at = state.project?.updated_at || state.generated_at || p.updated_at;
  if (APP.currentProject && String(APP.currentProject.id) === String(p.id)) APP.currentProject = p;
}

function stateOwnedBy(data, project) {
  if (data?.project) {
    return String(data.project.id) === String(project.id) || String(data.project.code || "").toLowerCase() === String(project.code || "").toLowerCase();
  }
  // 没有 data.project 时退化为"当前项目即默认项目"，不再写死某个项目 id
  return String(project.id) === String(APP.defaultProjectId || project.id);
}

async function loadState(project, force = false) {
  if (!project) return;
  if (!force && APP.stateLoading) return;
  const seq = ++APP.stateSeq;
  if (APP.stateAbort) APP.stateAbort.abort();
  const ctrl = new AbortController();
  APP.stateAbort = ctrl;
  APP.stateLoading = true;
  try {
    const d = await fetchJSON(`/api/state?project=${encodeURIComponent(project.id)}`, { signal: ctrl.signal });
    if (seq !== APP.stateSeq) return;
    if (!stateOwnedBy(d, project)) throw new Error("返回数据属于其他项目，已丢弃");
    APP.state = d;
    APP.stateProjectId = project.id;
    APP.stateErr = null;
    APP.updatedAt.state = Date.now();
    mergeProjectFromState(project, d);
    renderSidebar();
    if (ROUTE.kind === "project" && APP.currentProject && String(APP.currentProject.id) === String(project.id)) {
      renderProjectContent();
      updateSidebar();
    }
    updateUpdated();
    maybeOpenLegacyAgent();
  } catch (e) {
    if (e.name === "AbortError") return;
    if (seq !== APP.stateSeq) return;
    APP.state = null;
    APP.stateErr = e;
    if (ROUTE.kind === "project") renderProjectContent();
    updateUpdated();
  } finally {
    if (seq === APP.stateSeq) APP.stateLoading = false;
  }
}

async function loadTasksFallback(force = false, renderAfter = true) {
  const p = APP.currentProject;
  if (!p || APP.tasksLoading) return;
  if (!force && APP.tasksFallback?.projectId === p.id) return;
  APP.tasksLoading = true;
  if (force) APP.tasksFallback = null;
  if (renderAfter && ROUTE.kind === "project" && ROUTE.tab === "tasks") renderProjectContent();
  try {
    const d = await fetchJSON(`/api/projects/${encodeURIComponent(p.id)}/tasks?page=${APP.taskPage}&page_size=${APP.taskPageSize}`);
    if (APP.currentProject?.id !== p.id) return;
    APP.taskTotal = Number(d.total ?? (d.items || []).length) || 0;
    APP.tasksFallback = {
      projectId: p.id, items: d.items || [], total: APP.taskTotal,
      page: Number(d.page || APP.taskPage), pageSize: Number(d.page_size || APP.taskPageSize),
    };
  } catch (e) {
    if (APP.currentProject?.id !== p.id) return;
    APP.tasksFallback = { projectId: p.id, items: [], error: errText(e) || e.message };
  } finally {
    APP.tasksLoading = false;
    if (renderAfter && ROUTE.kind === "project" && ROUTE.tab === "tasks") renderProjectContent();
  }
}

async function loadDeliveriesFallback(force = false) {
  const p = APP.currentProject;
  if (!p || APP.deliveriesLoading) return;
  if (!force && APP.deliveriesFallback?.projectId === p.id) return;
  APP.deliveriesLoading = true;
  if (force) APP.deliveriesFallback = null;
  if (ROUTE.kind === "project" && ROUTE.tab === "deliveries") renderProjectContent();

    if (APP.currentProject?.id !== p.id) return;

    APP.deliveriesFallback = {
      projectId: p.id, items: d.items || [], total: APP.deliveryTotal,
      page: Number(d.page || APP.deliveryPage), pageSize: Number(d.page_size || APP.deliveryPageSize),
      pipeline: d.pipeline || null,
    };
  } catch (e) {
    if (APP.currentProject?.id !== p.id) return;
    APP.deliveriesFallback = { projectId: p.id, items: [], error: errText(e) || e.message };
  } finally {
    APP.deliveriesLoading = false;
    if (ROUTE.kind === "project" && ROUTE.tab === "deliveries") renderProjectContent();
  }
}
/* ---------- 更新提示 / 轮询 ---------- */
function canPoll() { return !APP.paused && !document.hidden; }

function updateUpdated() {
  const el = $("#updated");
  if (!el) return;
  const isProject = ROUTE.kind === "project";
  const ts = isProject ? APP.updatedAt.state : APP.updatedAt.platform;
  const err = isProject ? APP.stateErr : (APP.projectsErr || APP.overviewErr);
  const interval = isProject ? stateInterval() : 15000;
  let text;
  if (APP.paused) text = ts ? `已暂停 · 更新于 ${fmtTime(new Date(ts).toISOString())}` : "已暂停";
  else if (err) text = ts ? `连接中断 · 上次 ${fmtTime(new Date(ts).toISOString())}` : "连接中断";
  else if (!ts) text = "等待数据…";
  else text = `更新于 ${fmtTime(new Date(ts).toISOString())}`;
  if (el.textContent !== text) el.textContent = text;
  el.classList.toggle("stale", Boolean(ts && !APP.paused && !err && Date.now() - ts > interval * 2));
  const pulse = $("#pulse");
  if (pulse) pulse.className = "pulse" + (APP.paused ? " paused" : (err ? " err" : ""));
  const dot = $("#sb-conn-dot");
  if (dot) dot.className = "pdot " + (err ? "risk" : APP.paused ? "paused" : "active");
  const conn = $("#sb-conn-text");
  if (conn) conn.textContent = err ? "后端连接异常" : APP.paused ? "已暂停刷新" : "实时连接正常";
}

function updatePausedUI() {
  const b = $("#btn-pause");
  b.textContent = APP.paused ? "▶" : "⏸";
  b.title = APP.paused ? "继续自动刷新" : "暂停自动刷新";
  b.classList.toggle("active", APP.paused);
  b.setAttribute("aria-pressed", String(APP.paused));
  updateUpdated();
  renderSidebar();
}

let stateTimer = null;
function scheduleStatePolling() {
  if (stateTimer) clearInterval(stateTimer);
  stateTimer = setInterval(() => {
    if (!canPoll()) return;
    if (ROUTE.kind === "project" && APP.currentProject) loadState(APP.currentProject);
  }, stateInterval());
}

async function pollPlatform() {
  if (!canPoll()) return;
  await ensureProjects(true);
  if (ROUTE.kind === "project") {
    await loadOverview(); // 资源池跟随现有 15s 轮询，复用平台概览接口
    if (APP.currentProject) {
      APP.currentProject = resolveProject(APP.currentProject.id) || APP.currentProject;
      if (APP.state) mergeProjectFromState(APP.currentProject, APP.state);
    }
    renderSidebar();
    if (APP.currentProject) {
      // 轮询重绘会清空正在输入的内容：设置页与智能层的输入框都要保护。
      const focusTag = document.activeElement && document.activeElement.tagName;
      const typing = ROUTE.tab === "p4" && ["INPUT", "TEXTAREA", "SELECT"].includes(focusTag);
      if (!(ROUTE.tab === "settings" && APP.settingsDirty) && !typing) renderProject();
    }
    updateSidebar();
  } else {
    await loadOverview();
    if (PLATFORM_KINDS.includes(ROUTE.kind)) renderPlatform(ROUTE.kind);
    if (ROUTE.kind === "settings") renderGlobalSettings();
  }
  updateUpdated();
}

async function manualRefresh() {
  if (ROUTE.kind === "project" && APP.currentProject) {
    await loadState(APP.currentProject, true);
    await loadOverview();
  } else {
    await ensureProjects(true);
    await loadOverview();
    if (PLATFORM_KINDS.includes(ROUTE.kind)) renderPlatform(ROUTE.kind);
    if (ROUTE.kind === "settings") renderGlobalSettings();
  }
  updateUpdated();
}
window.manualRefresh = manualRefresh;

function rerenderCurrent() {
  if (PLATFORM_KINDS.includes(ROUTE.kind)) renderPlatform(ROUTE.kind);
  else if (ROUTE.kind === "audit") renderAuditPage();
  else if (ROUTE.kind === "project") renderProjectContent();
}

}

function pagerMarkup({ id, testid, total, page, pageSize }) {
  const pages = Math.max(1, Math.ceil(total / pageSize));
  return `<div class="pager" data-testid="${testid}" id="${id}">
    <span data-pager-info>共 ${total} 条 · 第 ${page} / ${pages} 页</span>
    <select data-pager-size aria-label="每页条数">
      ${[20, 50, 100].map(n => `<option value="${n}" ${n === pageSize ? "selected" : ""}>${n} 条/页</option>`).join("")}
    </select>
    <button class="btn" data-pager-prev ${page <= 1 ? "disabled" : ""}>上一页</button>
    <button class="btn" data-pager-next ${page >= pages ? "disabled" : ""}>下一页</button>
  </div>`;
}
function bindPager(root, { page, pageSize, total, loading, onPage, onSize }) {
  if (!root) return;
  const pages = Math.max(1, Math.ceil(total / pageSize));
  const prev = root.querySelector("[data-pager-prev]");
  const next = root.querySelector("[data-pager-next]");
  const size = root.querySelector("[data-pager-size]");
  if (prev) prev.onclick = () => onPage(Math.max(1, page - 1));
  if (next) next.onclick = () => onPage(Math.min(pages, page + 1));
  if (size) size.onchange = () => onSize(Number(size.value));
  if (loading) root.querySelectorAll("button, select").forEach(el => { el.disabled = true; });
}

function resetProjectScopedState() {
  APP.projectDetail = null;
  APP.projectDetailErr = null;
  APP.projectDetailLoading = false;
  APP.teamTemplate = null;
  APP.teamTemplateErr = null;
  APP.taskDetail = null;
  APP.taskDetailErr = null;
  APP.taskDetailLoading = false;
  APP.taskError = null;
  APP.taskPendingTransition = null;
  APP.deliveryError = null;
  APP.settingsDirty = false;
  APP.settingsErr = null;
  APP.settingsNotice = null;
}

async function onRoute() {
  let r = parseRoute();
  if (r.kind === "unknown") {
    history.replaceState(null, "", location.pathname + location.search + "#/");
    r = parseRoute();
  }
  closeAll();
  // 移动端点了导航后侧栏必须收起，否则内容被盖住（旧实现漏了这一步）
  closeMobileSidebar();
  const prevKind = ROUTE.kind;
  const prevKey = ROUTE.key;
  if (prevKind !== r.kind || (r.kind === "project" && prevKey && prevKey !== r.key)) {
    query = "";
    projectQuery = "";
    const f = $("#filter");
    if (f) f.value = "";
  }
  ROUTE.kind = r.kind;
  ROUTE.key = r.key || null;
  ROUTE.tab = r.tab || null;
  ROUTE.params = r.params;

  if (PLATFORM_KINDS.includes(r.kind)) {
    APP.currentProject = null;
    resetProjectScopedState();
    await ensureProjects();
    if (r.kind === "recent") {
      renderPlatform(r.kind);
      loadRecentProjects().then(() => { if (ROUTE.kind === "recent") renderPlatform("recent"); });
    } else {
      renderPlatform(r.kind);
    }
    renderSidebar();
    updateSidebar();
    updateUpdated();
    loadOverview();
    return;
  }
  if (r.kind === "audit") {
    APP.currentProject = null;
    resetProjectScopedState();
    await ensureProjects();
    renderAuditPage();
    renderSidebar();
    updateSidebar();
    updateUpdated();
    return;
  }
  if (r.kind === "settings") {
    APP.currentProject = null;
    resetProjectScopedState();
    renderGlobalSettings();
    renderSidebar();
    updateSidebar();
    updateUpdated();
    return;
  }

  await ensureProjects();
  const p = resolveProject(r.key);
  if (!p) {
    APP.currentProject = null;
    renderProjectNotFound(r.key);
    renderSidebar();
    updateSidebar();
    return;
  }
  if (r.badTab) {
    history.replaceState(null, "", location.pathname + location.search + projectHash(p, r.tab));
  }

  const switched = APP.stateProjectId !== p.id;
  if (switched) {
    APP.stateSeq += 1;
    if (APP.stateAbort) { APP.stateAbort.abort(); APP.stateAbort = null; }
    APP.state = null;
    APP.stateErr = null;
    APP.stateProjectId = null;
    APP.stateLoading = false;
    APP.tasksFallback = null;
    APP.tasksLoading = false;
    APP.taskDetail = null;
    APP.taskDetailErr = null;
    APP.taskDetailLoading = false;
    APP.taskError = null;
    APP.taskPendingTransition = null;
    APP.deliveriesFallback = null;
    APP.deliveriesLoading = false;
    APP.deliveryError = null;
    APP.taskPage = 1;
    APP.taskTotal = 0;
    APP.deliveryPage = 1;
    APP.deliveryTotal = 0;
    APP.projectDetail = null;
    APP.projectDetailErr = null;
    APP.projectDetailLoading = false;
    APP.teamTemplate = null;
    APP.teamTemplateErr = null;
    APP.settingsDirty = false;
    APP.settingsErr = null;
    APP.settingsNotice = null;
    APP.openedLegacyAgent = null;
    expandedCols.clear();
    reportsExpanded = false;
    agentsExpanded = false;
  }
  APP.currentProject = p;
  if (r.tab !== "settings") {
    APP.settingsDirty = false;
    APP.settingsNotice = null;
    APP.settingsErr = null;
  }
  touchRecent(p.id);
  renderSidebar();
  updateSidebar();
  renderProject();
  if (switched || !APP.state) await loadState(p);
  else maybeOpenLegacyAgent();
  updateUpdated();
}

/* ---------- 初始化 ---------- */
function initSidebarState() {
  if (safeGet("agws-sidebar-collapsed") === "1") $("#app").classList.add("collapsed");
}

function openInfoModal(title, bodyHtml) {
  rememberFocus();
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = bodyHtml;
  mask.classList.add("show"); modal.classList.add("show");
  $("#modal-close").focus();
}

function bindGlobal() {
  $("#filter").addEventListener("input", (e) => {
    query = e.target.value.trim().toLowerCase();
    rerenderCurrent();
  });
  // 回车走服务端全局搜索（权限过滤在服务端完成，前端不做跨项目拼装）
  $("#filter").addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const value = e.target.value.trim();
    if (value.length < 1) return;
    e.preventDefault();
    navigate(`#/search?q=${encodeURIComponent(value)}`);
  });

  $("#btn-collapse").onclick = () => {
    const app = $("#app");
    const next = !app.classList.contains("collapsed");
    app.classList.toggle("collapsed", next);
    safeSet("agws-sidebar-collapsed", next ? "1" : "0");
    $("#btn-collapse").textContent = next ? "›" : "‹";
  };
  if ($("#app").classList.contains("collapsed")) $("#btn-collapse").textContent = "›";

  $("#btn-menu").onclick = () => {
    if ($("#sidebar").classList.contains("open")) { closeMobileSidebar(); return; }
    $("#sidebar").classList.add("open");
    $("#overlay-mobile").classList.add("show");
  };
  $("#overlay-mobile").onclick = closeMobileSidebar;

  $("#btn-refresh").onclick = manualRefresh;
  $("#btn-pause").onclick = () => {
    APP.paused = !APP.paused;
    updatePausedUI();
    if (!APP.paused) manualRefresh();
  };
  $("#btn-new-project").onclick = openCreateProject;
  $("#btn-new-project-inline").onclick = openCreateProject;

  $("#btn-notify").onclick = () => openInfoModal("通知", `
    <div class="state-box" style="border:0"><div class="icon" aria-hidden="true">◇</div>
      <div class="t">暂无通知数据</div>
      <div class="d">通知将来自项目事件流；当前后端未提供通知接口。</div></div>`);
  $("#btn-help").onclick = () => openInfoModal("帮助", `
    <div class="kv">
      <span class="k">全局搜索</span><span class="v"><kbd class="kbd">⌘K</kbd> / <kbd class="kbd">Ctrl K</kbd></span>
      <span class="k">暂停刷新</span><span class="v">顶部 ⏸ 按钮；页面隐藏时自动暂停</span>
      <span class="k">项目切换</span><span class="v">左侧项目列表；URL 记录当前项目与 Tab</span>
      <span class="k">数据来源</span><span class="v mono">/api/state?project= · /api/projects · /api/file</span>
      <span class="k">口径</span><span class="v">项目指标取 project_usage；用量构成/趋势为机器级本机口径</span>
    </div>
    <p class="hint" style="margin:0">项目、任务、交付验收与团队模板的写操作会写入平台 SQLite 并记录审计；归档项目全部写入口禁用。缺失数据显示 —，不伪造统计。</p>`);
  $("#btn-user").onclick = () => openInfoModal("本机用户", `
    <div class="kv">
      <span class="k">模式</span><span class="v">单机单用户</span>
      <span class="k">身份</span><span class="v">本机用户（无登录/RBAC）</span>
      <span class="k">偏好</span><span class="v">主题、刷新间隔、收藏、最近访问保存在 localStorage</span>
    </div>
    <p class="hint" style="margin:0">本工作区不写项目仓库；创建项目通过后端接口完成。</p>`);

  document.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === "k") {
      e.preventDefault();
      const f = $("#filter");
      if (f) { f.focus(); f.select(); }
    }
  });

  window.addEventListener("hashchange", () => { onRoute(); });
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && !APP.paused) manualRefresh();
    updateUpdated();
  });
}

(async function boot() {
  initTheme();
  initSidebarState();
  bindGlobal();

  const legacyAgent = new URLSearchParams(location.search).get("agent");
  // 先拿到项目列表再决定落到哪个项目，否则默认项目 id 还没解析出来。
  await ensureProjects();
  if (!location.hash) {
    const target = legacyAgent
      ? `#/p/${APP.defaultProjectId || (APP.projects[0] && APP.projects[0].id) || "default"}/agents?agent=${encodeURIComponent(legacyAgent)}`
      : "#/";
    history.replaceState(null, "", location.pathname + location.search + target);
  }

  await onRoute();
  loadOverview();
  scheduleStatePolling();
  setInterval(() => { if (canPoll()) pollPlatform(); }, 15000);
  setInterval(updateUpdated, 5000);
})();
</script>
