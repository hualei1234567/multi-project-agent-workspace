          const src = await fetchJSON(`${base}/knowledge/sources`, {
            method: "POST",
            body: JSON.stringify({ title, kind: "note", classification, license }),
          });
          const item = await fetchJSON(`${base}/knowledge/items`, {
            method: "POST",
            body: JSON.stringify({ title, content, source_id: src.id, classification }),
          });
          const versionId = item.versions[0].id;
          await fetchJSON(`${base}/knowledge/versions/${encodeURIComponent(versionId)}/publish`, {
            method: "POST",
            body: JSON.stringify({ reviewed_by: "local" }),

                <div class="muted" style="margin-top:4px">${esc(h.snippet)}</div></div>`).join("")
            : p4Empty("无命中");

      const [defs, binds] = await Promise.all([

      body.innerHTML = `

          `<code>${esc(r.def_key)}</code>`, esc(r.name), p4Badge(r.status),
          String(r.latest_version ?? "—")]))}</div></div>
        <div class="panel"><div class="panel-head"><h3>项目绑定 ${binds.total || 0}</h3></div><div class="panel-body">
        ${p4Table(["Workflow", "版本", "状态", "已物化任务"], (binds.items || []).map(r => [
          `<code>${esc(r.def_key)}</code>`, `v${r.version}`, p4Badge(r.status),
          String(r.materialized)]))}</div></div>`;
    } else if (kind === "release") {
      const [rels, canaries, rollbacks] = await Promise.all([
        safe(fetchJSON(`${base}/releases`)),
        safe(fetchJSON(`${base}/canaries`)),
        safe(fetchJSON(`${base}/rollbacks`)),
      ]);
      body.innerHTML = `
        <div class="panel"><div class="panel-head"><h3>Release ${rels.total || 0}</h3></div><div class="panel-body">
        ${p4Table(["Key", "名称", "状态", "Manifest 摘要"], (rels.items || []).map(r => [
          `<code>${esc(r.release_key)}</code>`, esc(r.name), p4Badge(r.status),
          `<code>${esc(String(r.manifest_digest || "").slice(0, 12))}</code>`]))}</div></div>
        <div class="two-col">
          <div class="panel"><div class="panel-head"><h3>Canary ${canaries.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["部署", "流量", "状态"], (canaries.items || []).map(r => [
            `<code>${esc(String(r.id).slice(0, 14))}</code>`, `${r.traffic_pct}%`, p4Badge(r.status)]))}</div></div>
          <div class="panel"><div class="panel-head"><h3>回滚 ${rollbacks.total || 0}</h3></div><div class="panel-body">
          ${p4Table(["原因", "时间"], (rollbacks.items || []).map(r => [esc(r.reason), esc(r.created_at)]))}</div></div>
        </div>`;
    } else if (kind === "improvement") {
      const [patterns, cases] = await Promise.all([
        safe(fetchJSON(`${base}/improvements/failures`)),
        safe(fetchJSON(`${base}/improvements/cases`)),
      ]);
      body.innerHTML = `
        <div class="panel"><div class="panel-head"><h3>失败模式 ${patterns.total || 0}</h3></div><div class="panel-body">
        ${p4Table(["模式", "摘要", "出现次数"], (patterns.items || []).map(r => [
          `<code>${esc(r.pattern_key)}</code>`, esc(r.summary), String(r.occurrences)]))}</div></div>
        <div class="panel"><div class="panel-head"><h3>改进 Case ${cases.total || 0}</h3></div><div class="panel-body">
        ${p4Table(["标题", "来源", "状态", "根因"], (cases.items || []).map(r => [

          <div class="kv"><span class="k">Usage 事件</span><span class="v">${cost.events ?? "—"}</span></div>

          <div class="kv"><span class="k">数据质量</span><span class="v">${p4Badge(cost.quality)}</span></div>
        </div></div>
        <div class="panel"><div class="panel-head"><h3>指标字典 ${metrics.total || 0}</h3></div><div class="panel-body">
        ${p4Table(["指标", "名称", "公式", "单位"], (metrics.items || []).map(r => [
          `<code>${esc(r.metric_key)}</code>`, esc(r.name), esc(r.formula), esc(r.unit || "—")]))}</div></div>`;
    } else if (kind === "autonomy") {
      const data = await safe(fetchJSON(`${base}/autonomy/eligibilities`));

        <div class="panel"><div class="panel-head"><h3>自动化资格 ${data.total || 0}</h3></div><div class="panel-body">

          esc(r.revoked_at || "有效")]))}</div></div>`;
    }
  } catch (e) {
    body.innerHTML = errorBox(e);

}

function renderProjectContent() {
  const el = $("#tab-content");
  if (!el) return;
  // 设置页有未保存输入时，不被轮询/局部刷新覆盖（保存或离开后自动恢复）。
  if (ROUTE.tab === "settings" && APP.settingsDirty) return;
  if (APP.stateErr) { el.innerHTML = errorBox(APP.stateErr.message); return; }
  if (!APP.state) { el.innerHTML = skeletonBox(180); return; }
  switch (ROUTE.tab) {
    case "agents": renderAgentsPage(el); break;
    case "tasks": renderTasksPage(el); break;
    case "dispatch": renderDispatchPage(el); break;
    case "executions": renderExecutionsPage(el); break;
    case "deliveries": renderDeliveriesPage(el); break;
    case "p4": renderP4Page(el); break;
    case "docs": renderDocsPage(el); break;
    case "settings": renderSettingsPage(el); break;
    default: renderOverviewPage(el);
  }
}
/* ---------- 项目概览 ---------- */
function agentCounts(roster) {
  const out = { running: 0, stalled: 0, done: 0, idle: 0 };
  for (const r of roster || []) {
    const k = ["running", "stalled", "done", "idle"].includes(r.status) ? r.status : "idle";
    out[k] += 1;
  }
  return out;
}
function funnelCounts(kanban) {
  if (!Array.isArray(kanban)) return null;
  const find = (k) => kanban.find(c => c.key === k)?.tasks?.length ?? 0;
  return { todo: find("todo"), doing: find("doing"), review: find("review"), done: find("done"), blocked: find("blocked") };
}

}

const TL_STATES = [
  ["", "全部"],
  ["running", "运行中"],
  ["failed", "失败"],
  ["unverified", "未验证"],
  ["ok", "成功"],
];

function tlBadge(state) {
  const label = { running: "运行中", failed: "失败", unverified: "未验证", ok: "成功" }[state] || state || "—";
  return `<span class="tl-state ${esc(state || "")}" data-tstate="${esc(state || "")}">${esc(label)}</span>`;
}

async function loadTimeline(force = false) {
  const p = APP.currentProject;
  if (!p) return;
  if (!force && APP.timeline?.projectId === p.id && APP.timeline?.state === APP.timelineState) {
    paintTimeline();
    return;
  }
  if (APP.timelineLoading) return;
  APP.timelineLoading = true;
  try {
    const qs = APP.timelineState ? `?state=${encodeURIComponent(APP.timelineState)}` : "";
    const d = await fetchJSON(`/api/projects/${encodeURIComponent(p.id)}/timeline${qs}`);
    if (APP.currentProject?.id !== p.id) return;
    APP.timeline = { ...d, projectId: p.id, state: APP.timelineState };
    APP.timelineErr = null;
  } catch (e) {
    if (APP.currentProject?.id !== p.id) return;
    APP.timeline = null;
    APP.timelineErr = errText(e) || e.message;
  } finally {
    APP.timelineLoading = false;
    if (ROUTE.kind === "project" && ROUTE.tab === "executions") paintTimeline();
  }
}

function paintTimeline() {
  const rows = $("#tl-rows");
  if (!rows) return;
  const d = APP.timeline;
  const counter = $("#tl-count");
  if (APP.timelineErr) {
    rows.innerHTML = `<div class="form-err" role="alert">${esc(APP.timelineErr)}</div>`;
    if (counter) counter.textContent = "";
    paintTimelineFilter(null);
    return;
  }
  if (!d) {
    rows.innerHTML = APP.timelineLoading ? skeletonBox(140) : emptyBox("加载中", "正在读取执行事件");
    return;
  }
  paintTimelineFilter(d);
  if (counter) counter.textContent = `${d.total} 条事件`;
  if (d.status === "no_evidence") {
    rows.innerHTML = emptyBox("未运行", "没有采集到任何执行事件；这只说明没有证据，不代表执行成功");
    return;
  }
  const items = d.items || [];
  if (!items.length) {
    rows.innerHTML = emptyBox("该状态下暂无事件", "切换筛选条件试试");
    return;
  }
  rows.innerHTML = items.map(ev => `
    <div class="tl-row ${esc(ev.state)}">
      <span class="tl-dot"></span>
      <span class="tl-time mono">${esc(ago(ev.occurred_at))}</span>
      ${tlBadge(ev.state)}
      <span class="tl-agent">${esc(ev.agent_name || ev.role_key || ev.agent_id || "未归属")}</span>
      <span class="tl-type mono">${esc(ev.type_label || ev.event_type)}${ev.tool ? ` · ${esc(ev.tool)}` : ""}</span>
      <span class="tl-msg">${esc(ev.message || (ev.session_id ? `会话 ${ev.session_id}` : "—"))}</span>
    </div>`).join("");
  if (d.running_window_minutes) {
    rows.insertAdjacentHTML("beforeend",
      `<p class="tl-note">「运行中」= 最近 ${d.running_window_minutes} 分钟内有活动且没有明确结果；超窗口仍未完成的记为「未验证」。只有明确 ok 的事件才是「成功」。</p>`);
  }
}

function paintTimelineFilter(d) {
  const box = $("#tl-filter");
  if (!box) return;
  const counts = d?.counts || {};
  box.innerHTML = TL_STATES.map(([key, label]) => {
    const n = key ? (counts[key] ?? 0) : (d?.total ?? 0);
    return `<button type="button" class="tl-chip ${APP.timelineState === key ? "on" : ""}" data-tlstate="${esc(key)}">
      <b>${esc(label)}</b><span>${n}</span></button>`;
  }).join("");
  $$(".tl-chip[data-tlstate]", box).forEach(btn => {
    btn.onclick = () => {
      APP.timelineState = btn.dataset.tlstate || "";
      const qs = APP.timelineState ? `?state=${encodeURIComponent(APP.timelineState)}` : "";
      const hash = `#/p/${encodeURIComponent(APP.currentProject.id)}/executions${qs}`;
      history.replaceState(null, "", location.pathname + location.search + hash);
      ROUTE.params = new URLSearchParams(qs ? qs.slice(1) : "");
      loadTimeline(true);
    };
  });
}

function roleDesc(role) {
  const r = String(role || "").toLowerCase();

  if (r.includes("architect")) return ROLE_DESC["system-architect"];
  if (r.includes("ux") || r.includes("design")) return ROLE_DESC["ux-designer"];
  if (r.includes("frontend")) return ROLE_DESC["frontend-engineer"];

    </article>`;

  // 布局规则（固定）：General Owner 置顶居中单独一行，其余角色每行 3 个。
  // 不依赖后端给的 layer 数值——数据里层级缺失或全为同一层时也要稳定成型。
  const ROLE_ORDER = ["product-manager", "system-architect", "ux-designer",
                      "frontend-engineer", "backend-engineer", "qa-devops"];
  const isOwner = r => /owner/i.test(r.role || "") || /主会话/.test(r.form || "");
  const owners = list.filter(isOwner);
  const rest = list.filter(r => !isOwner(r)).sort((a, b) => {
    const ia = ROLE_ORDER.indexOf(String(a.role || "").toLowerCase().replace(/\s+/g, "-"));
    const ib = ROLE_ORDER.indexOf(String(b.role || "").toLowerCase().replace(/\s+/g, "-"));
    const ra = ia < 0 ? 99 : ia, rb = ib < 0 ? 99 : ib;
    if (ra !== rb) return ra - rb;
    return String(a.role).localeCompare(String(b.role));
  });

  const row = group => `<div class="org-row">${group.map(r => `<div class="org-cell">${card(r)}</div>`).join("")}</div>`;
  const bus = `<div class="org-bus" aria-hidden="true"></div>`;
  const layer = (label, sub, group) => group.length
    ? `<div class="org-layer">
         <div class="org-layer-label"><b>${esc(label)}</b><span>${esc(sub)}</span></div>
         ${row(group)}
       </div>`
    : "";
  const parts = [];
  if (owners.length) {
    // 多个 main session 时仍居中排列，但只在第一行
    parts.push(`<div class="org-owner-row">${owners.map(r => `<div class="org-owner">${card(r)}</div>`).join("")}</div>`);
  }
  // 1+6 固定两层：战略与管理层（前 3）/ 研发与交付层（其余），每层最多 3 列
  const strategy = rest.slice(0, 3);
  const delivery = rest.slice(3, 6);
  if (strategy.length) {
    parts.push(bus);
    parts.push(layer("战略与管理层", "规划 · 架构 · 体验", strategy));
  }
  if (delivery.length) {
    parts.push(bus);
    parts.push(layer("研发与交付层", "开发 · 测试 · 运维", delivery));
  }
  el.innerHTML = `<div class="org-tree">${parts.filter(Boolean).join("")}</div>`;
  $$(".role-card", el).forEach(cardEl => {
    const fn = () => openRole(cardEl.dataset.role);
    cardEl.onclick = fn;
    cardEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };
  });
}

function normalizeTaskStatus(status) {
  const s = String(status || "").toLowerCase();
  for (const c of COL_DEFS) if (c.statuses.includes(s)) return c.key;
  return "todo";
}
function canonicalTaskStatus(status) {
  return COL_TO_STATUS[normalizeTaskStatus(status)] || "todo";
}
function taskApiItems() {
  const p = APP.currentProject;
  const api = APP.tasksFallback;
  if (api && api.projectId === p?.id && !api.error) return api.items;
  return null;
}
function kanbanIndex() {
  const out = {};
  for (const c of APP.state?.kanban || []) {
    for (const t of c.tasks || []) out[String(t.id)] = t;
  }
  return out;
}
function apiTaskToView(t) {
  const key = String(t.task_key || t.id || "—");
  return {
    id: key,
    apiId: String(t.id || t.task_key || ""),
    title: t.title || t.name || "—",
    priority: t.priority || "P2",
    owner: t.assignee || t.assignee_agent_id || t.owner || "—",
    status: t.status || "todo",
    description: t.description || "",
    readonly: Boolean(t.readonly),
    source: t.source || "platform",
    version: t.version,
    commits: [],
    reports: [],
    raw: t,
  };
}
function columnsFromApi(items) {
  const cols = COL_DEFS.map(c => ({ key: c.key, label: c.label, tasks: [] }));
  const idx = kanbanIndex();
  for (const t of items) {
    const v = apiTaskToView(t);
    const board = idx[v.id];
    if (board) {
      v.commits = board.commits || [];
      v.reports = board.reports || [];
      v.qa = board.qa;
    }
    const col = cols.find(c => c.key === normalizeTaskStatus(t.status)) || cols[0];
    col.tasks.push(v);
  }
  return cols;
}
function mapFallbackTasks(items) {
  return columnsFromApi(items || []);
}

function bindKanbanDrag(el) {
  $$(".tcard", el).forEach(card => {
    if (card.getAttribute("draggable") !== "true") return;
    card.addEventListener("dragstart", (e) => {
      APP.dragTask = { apiId: card.dataset.apiId, id: card.dataset.task, status: card.dataset.status };
      try { e.dataTransfer.setData("text/plain", card.dataset.task); } catch {}
      if (e.dataTransfer) e.dataTransfer.effectAllowed = "move";
    });
    card.addEventListener("dragend", () => {
      APP.dragTask = null;
      $$(".col", el).forEach(c => c.classList.remove("drag-over"));
    });
  });
  $$(".col", el).forEach(col => {
    col.addEventListener("dragover", (e) => {
      if (!APP.dragTask) return;
      e.preventDefault();
      col.classList.add("drag-over");
    });
    col.addEventListener("dragleave", () => col.classList.remove("drag-over"));
    col.addEventListener("drop", (e) => {
      e.preventDefault();
      col.classList.remove("drag-over");
      const drag = APP.dragTask;
      APP.dragTask = null;
      if (!drag) return;
      const to = COL_TO_STATUS[col.dataset.key];
      handleBoardTransition(drag, to);
    });
  });
}

function renderKanban(cols) {
  const el = $("#kanban");
  if (!el) return;
  const archived = projectArchived();
  const apiReady = Boolean(taskApiItems());
  const total = cols.reduce((a, c) => a + (c.tasks || []).length, 0);
  const countEl = $("#task-count");
  if (countEl) countEl.textContent = `${total} 项`;
  el.innerHTML = cols.map(c => {
    const raw = c.tasks || [];
    const list = raw.filter(t => filtered(t.id) || filtered(t.title) || filtered(t.owner) || filtered(t.status) ||
      (t.commits || []).some(x => filtered(x.sha) || filtered(x.subject)));
    const pct = total ? Math.round(list.length / Math.max(1, total) * 100) : 0;
    return `
    <div class="col" data-key="${esc(c.key)}">
      <div class="col-head"><h3>${esc(c.label || c.key)}</h3><span class="n">${list.length}</span></div>
      <div class="col-bar"><i style="width:${pct}%"></i></div>
      ${list.length ? list.slice(0, expandedCols.has(c.key) ? list.length : 6).map(t => {
        const canDrag = !archived && !t.readonly && apiReady;
        return `
        <div class="tcard" data-task="${esc(t.id)}" data-api-id="${esc(t.apiId || t.id)}" data-status="${esc(t.status)}"
             role="button" tabindex="0" draggable="${canDrag ? "true" : "false"}"
             aria-label="任务 ${esc(t.id)} ${esc(t.title)}">
          <div class="tid">${esc(t.id)}${t.readonly ? ` <span class="readonly-chip">来自任务板镜像</span>` : ""}</div>
          <div class="tt">${esc(t.title)}</div>
          <div class="trow">
            <span class="pri pri-${esc(t.priority)}">${esc(t.priority)}</span>
            <span>${esc(t.owner)}</span>
            ${(t.commits?.length || t.reports?.length) ? `<span class="links">${
              (t.commits || []).map(x => `<span title="${esc(x.subject)}">⎇ ${esc(x.sha)}</span>`).join("")
            }${(t.reports || []).map(r => `<span title="${esc(r.path)}">📄</span>`).join("")}</span>` : ""}
          </div>
        </div>`;
      }).join("") : `<div class="empty">${query ? "没有匹配的任务" : "—"}</div>`}
      ${list.length > 6 ? `<button class="more" data-more="${esc(c.key)}">${expandedCols.has(c.key) ? "收起" : `展开其余 ${list.length - 6} 项`}</button>` : ""}
    </div>`;
  }).join("");
  $$(".tcard", el).forEach(cardEl => {
    const fn = () => openTask(cardEl.dataset.apiId, cardEl.dataset.task);
    cardEl.onclick = fn;
    cardEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };
  });
  $$(".more", el).forEach(btn => {
    btn.onclick = (e) => {
      e.stopPropagation();
      const key = btn.dataset.more;
      expandedCols.has(key) ? expandedCols.delete(key) : expandedCols.add(key);
      renderKanban(cols);
    };
  });
  bindKanbanDrag(el);
}

async function openTask(apiId, displayId) {
  APP.taskErrApiId = apiId;
  APP.taskErrDisplay = displayId;
  APP.taskDetail = null;
  APP.taskDetailErr = null;
  APP.taskDetailWarning = null;
  APP.taskDetailLoading = true;
  APP.taskPendingTransition = null;
  openTaskDrawer();
  $("#task-drawer-title").textContent = displayId || apiId || "任务详情";
  $("#task-drawer-body").innerHTML = skeletonBox(180);
  const pid = APP.currentProject?.id;
  try {
    const d = await fetchJSON(`/api/projects/${encodeURIComponent(pid)}/tasks/${encodeURIComponent(apiId)}`);
    if (APP.currentProject?.id !== pid) return;
    const t = d?.task || d;
    APP.taskDetail = {
      ...t,
      dependencies: d?.dependencies ?? t.dependencies,
      events: d?.events ?? t.events,
      _apiId: apiId,
      _displayId: displayId || t.task_key || apiId,
    };
  } catch (e) {
    const local = findTask(displayId || apiId);
    if (local) {
      APP.taskDetail = { ...local, readonly: true, _apiId: apiId, _displayId: displayId || local.id, _localOnly: true };
      APP.taskDetailErr = null;
      APP.taskDetailWarning = errText(e);
    } else {
      APP.taskDetailErr = e;
    }
  } finally {
    APP.taskDetailLoading = false;
    if (APP.currentProject?.id === pid) renderTaskDetail();
  }
}

  let list = t.acceptance_criteria ?? t.acceptance ?? [];

  return Array.isArray(list) ? list : [];
}
function dependencyList(t) {
  const list = t.dependencies || t.depends_on || [];
  return Array.isArray(list) ? list : [];
}
function taskEvents(t) {
  const list = t.events || t.timeline || [];
  return Array.isArray(list) ? list : [];
}

async function loadDispatch(force = false) {
  const key = dispatchProjectKey();
  if (APP.dispatchLoading && !force) return;
  APP.dispatchLoading = true;
  try {
    const base = `/api/projects/${encodeURIComponent(key)}`;
    const [sched, plans, executor] = await Promise.all([
      fetchJSON(`${base}/dispatch/schedulable`).catch(() => ({ ready: [], skipped: [] })),
      fetchJSON(`${base}/dispatch/plans?page=1&page_size=20`).catch(() => ({ items: [] })),
      fetchJSON(`${base}/dispatch/executor`).catch(() => ({ global_enabled: false })),
    ]);
    APP.dispatch = { schedulable: sched, plans: plans.items || [], executor };
  } catch (err) {
    APP.dispatch = { schedulable: { ready: [], skipped: [] }, plans: [], executor: {}, error: err.message };
  } finally {
    APP.dispatchLoading = false;
  }
  if (ROUTE.tab === "dispatch") renderProjectContent();
}

async function createDispatchPlan() {
  const key = dispatchProjectKey();
  try {
    const plan = await fetchJSON(`/api/projects/${encodeURIComponent(key)}/dispatch/plan`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ strategy: "priority" }),
    });
    dispatchNotice(`已生成计划：${plan.items?.length ?? 0} 项`);

    openDispatchDetail(plan.id, Boolean(APP.dispatch?.executor?.global_enabled));
  } catch (err) {
    dispatchNotice(`生成失败：${err.message}`, true);

}

async function transitionTaskApi(t, to, reason) {
  const pid = APP.currentProject?.id;
  const apiId = t._apiId || t.id;
  const body = { to_status: to };
  if (t.version != null) body.expected_version = t.version;
  if (reason) body.reason = reason;
  const d = await fetchJSON(`/api/projects/${encodeURIComponent(pid)}/tasks/${encodeURIComponent(apiId)}/transition`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  return d?.task || d;
}

async function doTaskTransition(to, reason) {
  const t = APP.taskDetail;
  if (!t) return;
  const prevStatus = t.status;
  const prevVersion = t.version;
  t.status = to;
  APP.taskPendingTransition = null;
  APP.taskError = null;
  renderTaskDetail();
  try {
    const updated = await transitionTaskApi(t, to, reason);
    APP.taskDetail = { ...t, ...(updated && typeof updated === "object" ? updated : {}), _apiId: t._apiId, _displayId: t._displayId };
    APP.taskError = null;
    await loadTasksFallback(true, true);
    renderTaskDetail();
  } catch (e) {
    t.status = prevStatus;
    t.version = prevVersion;
    APP.taskError = errText(e);
    renderTaskDetail();
    if (ROUTE.tab === "tasks") renderProjectContent();
  }
}

/** 拖拽流转：先乐观改列，失败回滚并提示。 */
async function handleBoardTransition(drag, to) {
  if (!to) return;
  const api = APP.tasksFallback;
  const item = (api?.items || []).find(x => String(x.id || x.task_key) === String(drag.apiId));
  const cur = canonicalTaskStatus(drag.status);
  if (cur === to) return;
  if (!(TASK_TRANSITIONS[cur] || []).includes(to)) {
    APP.taskError = `不能从「${TASK_STATUS_LABEL[cur] || cur}」流转到「${TASK_STATUS_LABEL[to] || to}」`;
    renderProjectContent();
    return;
  }
  if (to === "blocked") {
    APP.taskError = "流转到「阻塞」需填写原因，请在任务详情中操作";
    renderProjectContent();
    return;
  }
  if (!item) { APP.taskError = "未找到任务数据，请刷新后重试"; renderProjectContent(); return; }
  const prev = item.status;
  item.status = to;
  renderProjectContent();
  try {
    const t = { ...apiTaskToView(item), _apiId: drag.apiId, version: item.version };
    const updated = await transitionTaskApi(t, to, "");
    if (updated && typeof updated === "object") Object.assign(item, updated);
    APP.taskError = null;
    await loadTasksFallback(true);
  } catch (e) {
    item.status = prev;
    APP.taskError = errText(e);
    renderProjectContent();
  }
}

/* ---------- 交付页 ---------- */
function apiDeliveryItems() {
  const p = APP.currentProject;
  const f = APP.deliveriesFallback;
  if (f && f.projectId === p?.id && !f.error) return f.items;
  return null;
}
function sameDelivery(a, b) {
  if (a.path && b.path && String(a.path) === String(b.path)) return true;
  const an = String(a.title || a.name || "").trim();
  const bn = String(b.name || b.title || "").trim();
  return Boolean(an && bn && an === bn);
}
function deliveryRows() {
  const s = APP.state;
  const api = apiDeliveryItems() || [];
  const base = [];
  if (Array.isArray(s.deliveries) && s.deliveries.length) {
    for (const d of s.deliveries) base.push({
      name: d.title || d.name || "—", kind: d.kind || d.delivery_type || "—",
      task: d.task_code || d.task_key || d.task_id || "—", path: d.path || "",
      size: d.size ?? null, time: d.created_at || d.mtime || null,
      status: d.status || null, id: d.id || null, readonly: d.readonly === true,
      summary: d.summary || "", source: d.source || "",
    });
  } else if (Array.isArray(s.reports)) {
    for (const r of s.reports) base.push({
      name: r.name || "—",
      kind: (r.name || "").endsWith(".md") ? "document" : (r.name || "").endsWith(".zip") ? "release" : "other",
      task: r.task_id || r.task_code || "—", path: r.path || "",
      size: r.size ?? null, time: r.mtime || null,
      status: null, id: null, readonly: false, summary: "", source: "report",
    });
  }
  if (!base.length && APP.deliveriesFallback?.items) {
    for (const d of APP.deliveriesFallback.items) base.push({
      name: d.title || d.name || "—", kind: d.kind || d.delivery_type || "—",
      task: d.task_code || d.task_key || d.task_id || "—", path: d.path || "",
      size: d.size ?? null, time: d.created_at || null,
      status: d.status || null, id: d.id || null, readonly: d.readonly === true,
      summary: d.summary || "", source: d.source || "",
    });
  }
  for (const row of base) {
    const match = api.find(a => sameDelivery(a, row));
    if (match) {
      row.status = match.status || row.status;
      row.id = match.id || row.id;
      row.readonly = match.readonly === true || match.source === "mirror";
      row.summary = match.summary || row.summary;
      row.source = match.source || row.source;
      row.task = match.task_key || match.task_code || row.task;
      row.validation_state = match.validation_state || null;
      row.resubmit_count = Number(match.resubmit_count || 0);
    }
  }
  const seen = new Set(base.map(r => r.id).filter(Boolean));
  for (const a of api) {
    if (a.id && seen.has(a.id)) continue;
    if (base.some(r => sameDelivery(a, r))) continue;
    base.push({
      name: a.title || a.name || "—", kind: a.kind || a.delivery_type || "—",
      task: a.task_key || a.task_code || a.task_id || "—", path: a.path || "",
      size: a.size ?? null, time: a.created_at || null,
      status: a.status || "submitted", id: a.id || null,
      readonly: a.readonly === true || a.source === "mirror",
      summary: a.summary || "", source: a.source || "",
      validation_state: a.validation_state || null,
      resubmit_count: Number(a.resubmit_count || 0),
    });
  }
  return base.length ? base : (api ? [] : null);
}

function validationBadge(state) {
  const map = {
    pass: ["ok", "已验证"],
    fail: ["bad", "未通过"],
    unverified: ["warn", "未验证"],
  };
  const [cls, text] = map[String(state || "")] || ["none", "未校验"];
  return `<span class="dlv-badge ${cls}" data-vstate="${esc(state || "")}">${esc(text)}</span>`;
}

function deliveryStageBar(pipeline, active) {
  if (!pipeline) return "";
  const reviewable = Number(pipeline.reviewable || 0);
  const chip = (key, label, count, hint) => `
    <button type="button" class="dlv-stage ${active === key ? "on" : ""}" data-stage="${esc(key)}" title="${esc(hint)}">
      <b>${esc(label)}</b><span>${count}</span>
    </button>`;
  const stages = (pipeline.stages || []).map(s =>
    chip(s.key, s.label, s.count, s.hint)).join("");
  return `<div class="dlv-flow" data-testid="delivery-flow">
    ${chip("", "全部", reviewable, "所有可验收的交付（不含镜像）")}
    ${stages}
    ${chip("mirror", "镜像只读", pipeline.mirror || 0, "仓库里的报告镜像，只读不可验收")}
  </div>`;
}

function deliveryStepper(stage) {
  const steps = [
    { key: "submitted", label: "提交" },
    { key: "validated", label: "校验" },
    { key: "accepted", label: "验收" },
    { key: "rejected", label: "返工" },
  ];
  const stateOf = (key) => {
    if (stage === "accepted") return key === "rejected" ? "skip" : "done";
    if (stage === "rejected") {
      if (key === "submitted" || key === "validated") return "done";
      if (key === "accepted") return "fail";
      return "active";
    }
    if (stage === "validated") {
      if (key === "submitted") return "done";
      return key === "validated" ? "active" : "pending";
    }
    return key === "submitted" ? "active" : "pending";
  };
  return `<div class="dlv-steps" data-testid="delivery-steps">${steps.map(s0 => {
    const st = stateOf(s0.key);
    return `<span class="dlv-step ${st}" data-step="${s0.key}">${esc(s0.label)}</span>`;
  }).join('<i class="dlv-sep"></i>')}</div>`;
}

async function runDeliveryValidate(id, btn) {

    const d = await fetchJSON(`/api/projects/${encodeURIComponent(APP.currentProject.id)}/deliveries/${encodeURIComponent(id)}/validate`, { method: "POST" });
    const state = d?.validation?.state;
    const bad = (d?.validation?.checks || []).filter(c => c.state !== "pass");
    APP.deliveryError = state === "pass" ? null
      : `校验结论：${state === "fail" ? "未通过" : "未验证"}（${bad.map(c => `${c.label}：${c.detail}`).join("；") || "无明细"}）`;
  } catch (e) {
    APP.deliveryError = errText(e);
  }
  APP.deliveriesFallback = null;
  await loadDeliveriesFallback(true);
}

        <button class="btn sm" onclick="loadDeliveriesFallback(true)">重试</button></div>` : ""}
      <div class="panel table-wrap"><table id="deliveries">
        <colgroup><col class="c-name"><col class="c-stage"><col class="c-check"><col class="c-kind"><col class="c-task"><col class="c-time"><col class="c-act"></colgroup>
        <thead><tr><th>交付名称</th><th>环节</th><th>校验</th><th>类型</th><th>关联任务</th><th>时间</th><th>操作</th></tr></thead>
        <tbody>${list.length ? list.map(r => {
          const reviewable = Boolean(r.id) && !r.readonly && !archived;
          return `
          <tr class="file-row" data-path="${esc(r.path)}" data-delivery-id="${esc(r.id || "")}" role="button" tabindex="0" aria-label="查看交付 ${esc(r.name)}">
            <td class="wrap2"><span class="clamp-2" title="${esc(r.name)}">${esc(r.name)}</span>${r.readonly ? ` <span class="readonly-chip">只读镜像</span>` : ""}${Number(r.resubmit_count || 0) > 0 ? ` <span class="dlv-rw">返工 ${r.resubmit_count} 次</span>` : ""}</td>
            <td>${deliveryStatusPill(r.status || "submitted")}</td>
            <td>${validationBadge(r.validation_state)}</td>
            <td class="mono">${esc(r.kind)}</td><td class="mono">${esc(r.task)}</td>
            <td class="mono">${esc(ago(r.time))}</td>
            <td class="dlv-ops">${r.id ? `<button class="btn sm" data-testid="delivery-detail-${esc(r.id)}" data-detail-id="${esc(r.id)}">详情</button>` : ""}${reviewable ? `<button class="btn sm" data-testid="delivery-validate-${esc(r.id)}" data-validate-id="${esc(r.id)}">校验</button>` : ""}${reviewable ? `<button class="btn sm" data-testid="delivery-review-${esc(r.id)}" data-review-id="${esc(r.id)}">验收</button>` : ""}</td>
          </tr>`;
        }).join("") : `<tr><td colspan="7" class="empty">${query ? "没有匹配的交付" : (stage ? "该环节暂无交付" : "暂无交付记录")}</td></tr>`}</tbody>
      </table>
      ${api && APP.deliveryTotal > 0 ? pagerMarkup({ id: "deliveries-pager", testid: "deliveries-pager", total: APP.deliveryTotal, page: APP.deliveryPage, pageSize: APP.deliveryPageSize }) : ""}
      </div>
    </section>`;
  bindPager($("#deliveries-pager"), {
    page: APP.deliveryPage, pageSize: APP.deliveryPageSize, total: APP.deliveryTotal, loading: APP.deliveriesLoading,
    onPage: (n) => { APP.deliveryPage = n; APP.deliveriesFallback = null; loadDeliveriesFallback(true); },
    onSize: (n) => { APP.deliveryPageSize = n; APP.deliveryPage = 1; APP.deliveriesFallback = null; loadDeliveriesFallback(true); },
  });
  const closeErr = $("#delivery-err-close");
  if (closeErr) closeErr.onclick = () => { APP.deliveryError = null; renderProjectContent(); };
  $$("#deliveries .file-row", el).forEach(rowEl => {
    if (!rowEl.dataset.deliveryId) return;
    const fn = () => openDeliveryDetail(rowEl.dataset.deliveryId);
    rowEl.onclick = fn;
    rowEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };
  });
  $$("#deliveries [data-detail-id], #deliveries [data-validate-id], #deliveries [data-review-id]", el).forEach(btn => {
    btn.onclick = async (e) => {
      e.preventDefault();
      e.stopPropagation();
      if (btn.dataset.reviewId) {
        const row = rows.find(r => String(r.id) === String(btn.dataset.reviewId));
        if (row) openDeliveryReview(row);
      } else if (btn.dataset.validateId) {
        await runDeliveryValidate(btn.dataset.validateId, btn);
      } else if (btn.dataset.detailId) {
        openDeliveryDetail(btn.dataset.detailId);
      }
    };
    btn.onkeydown = (e) => e.stopPropagation();
  });
  $$(".dlv-stage[data-stage]", el).forEach(btn => {
    btn.onclick = () => {
      APP.deliveryStage = btn.dataset.stage || "";
      APP.deliveryPage = 1;
      APP.deliveriesFallback = null;
      // 环节筛选进 URL：可分享、可回退，刷新不丢
      const qs = APP.deliveryStage ? `?stage=${encodeURIComponent(APP.deliveryStage)}` : "";
      const base = `#/p/${encodeURIComponent(APP.currentProject.id)}/deliveries${qs}`;
      history.replaceState(null, "", location.pathname + location.search + base);
      ROUTE.params = new URLSearchParams(qs ? qs.slice(1) : "");
      loadDeliveriesFallback(true);
    };
  });
  if (!api && !APP.deliveriesLoading) loadDeliveriesFallback();
  initColumnResizers();
}

async function openDeliveryDetail(id) {
  if (!id) return;
  const projectId = APP.currentProject?.id;
  if (!projectId) return;
  rememberFocus();
  $("#modal-title").textContent = "交付详情";
  $("#modal-body").innerHTML = skeletonBox(160);
  mask.classList.add("show"); modal.classList.add("show");
  let d;
  try {
    d = await fetchJSON(`/api/projects/${encodeURIComponent(projectId)}/deliveries/${encodeURIComponent(id)}`);
  } catch (e) {
    $("#modal-body").innerHTML = `<div class="form-err" role="alert">${esc(errText(e))}</div>`;
    return;
  }
  if (APP.currentProject?.id !== projectId) return;
  const item = d.delivery || {};
  const checks = Array.isArray(d.checks) ? d.checks : [];
  const history = Array.isArray(d.history) ? d.history : [];
  const icon = { pass: "✓", fail: "✕", unverified: "!" };
  const ckLabel = { pass: "通过", fail: "未通过", unverified: "未验证" };
  const historyLine = (h) => {
    const url = "";
    const detail = h.detail || {};
    let text = "";
    if (h.action === "delivery.review") {
      text = (detail.decision === "accepted" ? "验收通过" : "退回") + (detail.comment ? `：${detail.comment}` : "");
    } else if (h.action === "delivery.resubmit") {
      text = (detail.note || "重新提交") + (detail.previous_reason ? `（上次退回：${detail.previous_reason}）` : "");
    } else if (h.action === "delivery.validate") {
      text = `校验结论 ${ckLabel[detail.state] || detail.state || "—"}`;
    } else if (h.action === "delivery.submit") {
      text = detail.title || "提交交付";
    } else {
      text = JSON.stringify(detail).slice(0, 120);
    }
    return `<li><span class="at mono">${esc(ago(h.at))}</span><span class="lb">${esc(h.label || h.action)}</span><span class="dt">${esc(text)}</span></li>`;
  };
  const reviewable = !item.readonly && !projectArchived();
  $("#modal-body").innerHTML = `
    <div class="kv">
      <span class="k">交付名称</span><span class="v">${esc(item.title || "—")}${Number(item.resubmit_count || 0) > 0 ? ` <span class="dlv-rw">返工 ${item.resubmit_count} 次</span>` : ""}</span>
      <span class="k">关联任务</span><span class="v mono">${esc(item.task_key || item.task_id || "—")}</span>
      <span class="k">当前状态</span><span class="v">${deliveryStatusPill(item.status || "submitted")} ${validationBadge(item.validation_state)}</span>
      <span class="k">交付路径</span><span class="v mono">${esc(item.path || "未记录")}</span>
      ${item.reviewed_at ? `<span class="k">最近验收</span><span class="v mono">${esc(ago(item.reviewed_at))} · ${esc(item.reviewer || "—")}</span>` : ""}
      ${item.rejection_reason ? `<span class="k">退回原因</span><span class="v">${esc(item.rejection_reason)}</span>` : ""}
    </div>
    ${deliveryStepper(d.stage || "submitted")}
    <div class="dlv-sec"><h4>校验项<span class="dlv-sub">${d.validation?.checked_at ? `上次校验 ${esc(ago(d.validation.checked_at))}` : "尚未执行校验"}</span></h4>
      <ul class="dlv-checks" data-testid="delivery-checks">${checks.length ? checks.map(c => `
        <li class="dlv-check ${esc(c.state)}"><span class="dlv-ck">${icon[c.state] || "?"}</span>
          <span class="k">${esc(c.label)}</span><span class="v">${esc(c.detail)}</span>
          <span class="dlv-cs">${esc(ckLabel[c.state] || c.state)}</span></li>`).join("") : `<li class="empty">无校验项</li>`}</ul>
      <p class="dlv-sub">「未验证」表示无法核对，不等于通过；验收会重新跑一次校验，硬失败项会直接拦住验收。</p>
    </div>
    <div class="dlv-sec"><h4>流转历史</h4>
      <ul class="dlv-hist" data-testid="delivery-history">${history.length ? history.map(historyLine).join("") : `<li class="empty">暂无记录</li>`}</ul>
    </div>
    <div class="form-actions">
      ${item.path ? `<button type="button" class="btn" id="dv-open">打开产物</button>` : ""}
      <button type="button" class="btn" id="dv-cancel">关闭</button>
      ${reviewable ? `<button type="button" class="btn" id="dv-validate" data-testid="delivery-detail-validate">执行校验</button>` : ""}
      ${reviewable ? `<button type="button" class="btn primary" id="dv-review" data-testid="delivery-detail-review">验收 / 退回</button>` : ""}
      ${reviewable && item.status === "rejected" ? `<button type="button" class="btn primary" id="dv-resubmit" data-testid="delivery-detail-resubmit">重新提交</button>` : ""}
    </div>`;
  const openBtn = $("#dv-open");
  if (openBtn) openBtn.onclick = () => { closeAll(); openFile(item.path); };
  $("#dv-cancel").onclick = closeAll;
  const vBtn = $("#dv-validate");
  if (vBtn) vBtn.onclick = async () => {
    vBtn.disabled = true; vBtn.textContent = "校验中…";
    try {
      const res = await fetchJSON(`/api/projects/${encodeURIComponent(projectId)}/deliveries/${encodeURIComponent(id)}/validate`, { method: "POST" });
      APP.deliveryError = res?.validation?.state === "pass" ? null
        : `校验结论：${res?.validation?.state === "fail" ? "未通过" : "未验证"}`;
    } catch (e) {
      APP.deliveryError = errText(e);
    }
    APP.deliveriesFallback = null;
    await loadDeliveriesFallback(true);
    openDeliveryDetail(id);
  };
  const rBtn = $("#dv-review");
  if (rBtn) rBtn.onclick = () => {
    openDeliveryReview({
      id: item.id, name: item.title, status: item.status,
      task: item.task_key || item.task_id || "—", path: item.path, summary: item.summary,
    });
  };
  const rsBtn = $("#dv-resubmit");
  if (rsBtn) rsBtn.onclick = () => openDeliveryResubmit(d);
}

function openDeliveryResubmit(d) {
  const item = d?.delivery || {};
  if (!item.id) return;
  rememberFocus();
  $("#modal-title").textContent = "返工重新提交";
  $("#modal-body").innerHTML = `
    <div class="kv">
      <span class="k">交付名称</span><span class="v">${esc(item.title || "—")}</span>
      <span class="k">退回原因</span><span class="v">${esc(item.rejection_reason || "—")}</span>
      <span class="k">返工次数</span><span class="v mono">${Number(item.resubmit_count || 0)}</span>
    </div>
    <div class="field"><label for="rs-note">本次修改说明（必填）</label>
      <textarea id="rs-note" placeholder="说明这次改了什么，便于验收对照"></textarea></div>
    <div class="field"><label for="rs-path">交付路径（可选，留空沿用原路径）</label>
      <input id="rs-path" value="${esc(item.path || "")}" placeholder="相对项目仓库，例如 docs/reports/x.md"></div>
    <div class="field"><label for="rs-summary">交付说明（可选）</label>
      <input id="rs-summary" value="${esc(item.summary || "")}"></div>
    <div class="form-err" id="rs-err" role="alert"></div>
    <div class="form-actions">
      <button type="button" class="btn" id="rs-cancel">取消</button>
      <button type="button" class="btn primary" id="rs-submit" data-testid="delivery-resubmit-confirm">提交</button>
    </div>`;
  mask.classList.add("show"); modal.classList.add("show");
  $("#rs-cancel").onclick = closeAll;
  $("#rs-submit").onclick = async () => {
    const note = $("#rs-note").value.trim();
    const errEl = $("#rs-err");
    errEl.textContent = "";
    if (!note) { errEl.textContent = "必须说明本次修改内容"; return; }
    const btn = $("#rs-submit");
    btn.disabled = true; btn.textContent = "提交中…";
    try {
      await fetchJSON(`/api/projects/${encodeURIComponent(APP.currentProject.id)}/deliveries/${encodeURIComponent(item.id)}/resubmit`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          note,
          path: $("#rs-path").value.trim() || undefined,
          summary: $("#rs-summary").value.trim() || undefined,
        }),
      });
      closeAll();
      APP.deliveryError = null;
      APP.deliveriesFallback = null;
      await loadDeliveriesFallback(true);
    } catch (e) {
      errEl.textContent = errText(e);
      btn.disabled = false; btn.textContent = "提交";
    }
  };
}

function openDeliveryReview(row) {
  if (projectArchived()) return;
  rememberFocus();
  $("#modal-title").textContent = "交付验收";
  $("#modal-body").innerHTML = `
    <div class="kv">
      <span class="k">交付名称</span><span class="v">${esc(row.name)}</span>
      <span class="k">关联任务</span><span class="v mono">${esc(row.task || "—")}</span>
      <span class="k">当前状态</span><span class="v">${row.status ? deliveryStatusPill(row.status) : "—"}</span>
      ${row.path ? `<span class="k">路径</span><span class="v mono">${esc(row.path)}</span>` : ""}
    </div>
    ${row.summary ? `<div class="tk-sub">${esc(row.summary)}</div>` : ""}
    <div class="field"><label>处理结果</label>
      <div class="seg" id="dr-decision">
        <button type="button" data-decision="accepted" class="active">验收通过</button>
        <button type="button" data-decision="rejected">退回</button>
      </div>
    </div>
    <div class="field"><label for="dr-comment">说明 / 退回原因</label>
      <textarea id="dr-comment" placeholder="退回时必填，说明需要修改什么"></textarea></div>
    <div class="form-err" id="dr-err" role="alert"></div>
    <div class="form-actions">
      <button type="button" class="btn" id="dr-cancel">取消</button>
      <button type="button" class="btn primary" id="dr-submit" data-testid="delivery-review-confirm">确认</button>
    </div>`;
  mask.classList.add("show"); modal.classList.add("show");
  let decision = "accepted";
  $$("#dr-decision button").forEach(b => {
    b.onclick = () => {
      decision = b.dataset.decision;
      $$("#dr-decision button").forEach(x => x.classList.toggle("active", x === b));
    };
  });
  $("#dr-cancel").onclick = closeAll;
  $("#dr-submit").onclick = async () => {
    const comment = $("#dr-comment").value.trim();
    const errEl = $("#dr-err");
    errEl.textContent = "";
    if (decision === "rejected" && !comment) { errEl.textContent = "退回必须填写原因"; return; }
    const btn = $("#dr-submit");
    btn.disabled = true; btn.textContent = "提交中…";
    try {
      await fetchJSON(`/api/projects/${encodeURIComponent(APP.currentProject.id)}/deliveries/${encodeURIComponent(row.id)}/review`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ decision, comment: comment || undefined }),
      });
      closeAll();
      APP.deliveryError = null;
      await loadDeliveriesFallback(true);
    } catch (e) {
      errEl.textContent = errText(e);
      btn.disabled = false; btn.textContent = "确认";
    }
  };
}

function renderDocsPage(el) {
  const s = APP.state;
  const rows = (s.reports || []).filter(r => /\.(md|txt|html?|pdf|json|csv)$/i.test(r.name || ""));
  const list = rows.filter(r => filtered(r.name) || filtered(r.dir) || filtered(r.path));
  el.innerHTML = `
    <section>
      <div class="sec-head"><h2>文档与规范</h2><span class="desc">项目报告、规范与说明 · 点击预览</span><span class="count">${list.length} / ${rows.length}</span></div>
      ${rows.length ? `<div class="panel table-wrap"><table id="docs-table">
        <colgroup><col class="c-name"><col class="c-dir"><col class="c-size"><col class="c-time"></colgroup>
        <thead><tr><th>名称</th><th>目录</th><th>大小</th><th>更新时间</th></tr></thead>
        <tbody>${list.length ? list.map(r => `
          <tr class="file-row" data-path="${esc(r.path)}" role="button" tabindex="0">
            <td class="wrap2"><span class="clamp-2" title="${esc(r.name)}">${esc(r.name)}</span></td><td class="mono">${esc(r.dir || "—")}</td>
            <td class="mono">${esc(fmtSize(r.size))}</td><td class="mono">${esc(ago(r.mtime))}</td>
          </tr>`).join("") : `<tr><td colspan="4" class="empty">没有匹配的文档</td></tr>`}</tbody>
      </table></div>` : emptyBox(query ? "没有匹配的文档" : "暂无文档", "后端未返回项目报告列表")}
    </section>`;
  $$("#docs-table .file-row", el).forEach(rowEl => {
    const fn = () => openFile(rowEl.dataset.path);
    rowEl.onclick = fn;
    rowEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };
  });
  initColumnResizers();
}

/* ---------- 设置页 / 项目生命周期 ---------- */
async function loadProjectDetail(force = false) {
  const p = APP.currentProject;
  if (!p || APP.projectDetailLoading) return;
  if (!force && APP.projectDetail && String(APP.projectDetail.id) === String(p.id)) return;
  APP.projectDetailLoading = true;
  if (ROUTE.tab === "settings") renderProjectContent();
  try {
    const d = await fetchJSON(`/api/projects/${encodeURIComponent(p.id)}`);
    if (APP.currentProject?.id !== p.id) return;
    APP.projectDetail = d?.project || d;
    APP.projectDetailErr = null;
    loadTeamTemplateInfo();
  } catch (e) {
    if (APP.currentProject?.id !== p.id) return;
    APP.projectDetailErr = e;
    APP.projectDetail = null;
  } finally {
    APP.projectDetailLoading = false;
    if (ROUTE.tab === "settings") renderProjectContent();
  }
}

async function loadTeamTemplateInfo() {
  const key = APP.projectDetail?.team_template_key || APP.currentProject?.team_template_key;
  if (!key) return;
  try {
    const d = await fetchJSON(`/api/team-templates/${encodeURIComponent(key)}`);
    APP.teamTemplate = d?.template || d?.items?.[0] || d;
    APP.teamTemplateErr = null;
  } catch (e) {
    APP.teamTemplateErr = e;
    console.warn("[agws] 团队模板接口不可用：", e.message);
    return;
  }
  if (ROUTE.tab === "settings") renderProjectContent();
}

          <div class="field"><label for="ps-owner">负责人</label>
            <input id="ps-owner" maxlength="64" value="${esc(d.owner || "")}" placeholder="负责人 / Owner" autocomplete="off" ${archived ? "disabled" : ""}></div>
        </div>
        <div class="field"><label for="ps-desc">描述</label>
          <textarea id="ps-desc" maxlength="500" ${archived ? "disabled" : ""}>${esc(d.description || "")}</textarea></div>
        <div class="form-row">
          <div class="field"><label for="ps-repo">仓库路径</label>
            <input id="ps-repo" maxlength="512" value="${esc(d.repo_root || "")}" autocomplete="off" ${archived ? "disabled" : ""}></div>
          <div class="field"><label for="ps-branch">默认分支</label>
            <input id="ps-branch" maxlength="120" value="${esc(d.default_branch || "")}" placeholder="main" autocomplete="off" ${archived ? "disabled" : ""}></div>
        </div>
        <div class="form-err" id="ps-err" role="alert"></div>
        <div class="form-actions">
          <button type="button" class="btn" id="ps-reset" ${archived ? "disabled" : ""}>重置</button>
          <button type="submit" class="btn primary" id="ps-save" data-testid="project-save" ${archived ? "disabled" : ""}

function lifecycleCard() {
  const p = APP.currentProject;
  if (!p) return "";
  const archived = isArchivedProject(APP.projectDetail) || isArchivedProject(p);
  return `
    <div class="set-card">
      <h3>项目生命周期</h3>
      <div class="kvline"><span class="k">当前状态</span><span class="v">${statusBadge(archived ? "archived" : (p.status || "active"))}</span></div>
      ${archived ? `<div class="kvline"><span class="k">归档时间</span><span class="v">${esc(fmtDateTime((APP.projectDetail || p).archived_at))}</span></div>` : ""}
      <p class="hint" style="margin:0">归档后项目进入只读：任务创建/流转、交付验收、设置保存全部禁用；已采集数据保留，可随时恢复。</p>
      <div class="inline-actions">
        ${archived
          ? `<button class="btn primary" id="ps-restore">恢复项目</button>`
          : `<button class="btn danger" id="ps-archive" data-testid="archive-project">归档项目</button>`}

function readSettingsVersion() {
  const v = Number($("#ps-version")?.value);
  return Number.isFinite(v) && $("#ps-version")?.value !== "" ? v : undefined;
}

async function saveProjectSettings(e) {
  e.preventDefault();
  if (projectArchived()) return;
  const form = $("#ps-form");
  const name = $("#ps-name").value.trim();
  const description = $("#ps-desc").value.trim();
  const owner = $("#ps-owner").value.trim();
  const repoRoot = $("#ps-repo").value.trim();
  const branch = $("#ps-branch").value.trim();
  const errEl = $("#ps-err");
  errEl.textContent = "";
  if (name.length < 2 || name.length > 120) { errEl.textContent = "项目名称需为 2–120 个字符"; return; }
  if (repoRoot.length > 512) { errEl.textContent = "仓库路径最多 512 个字符"; return; }
  const body = { name, description, owner, repo_root: repoRoot, default_branch: branch };
  const version = readSettingsVersion();
  if (version !== undefined) body.version = version;
  const btn = $("#ps-save");
  btn.disabled = true; btn.textContent = "保存中…";
  try {
    const d = await fetchJSON(`/api/projects/${encodeURIComponent(APP.currentProject.id)}`, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    APP.projectDetail = { ...(APP.projectDetail || {}), ...(d?.project || body), id: APP.currentProject.id };
    APP.settingsDirty = false;
    APP.settingsErr = null;
    APP.settingsNotice = "项目信息已保存";
    await ensureProjects(true);
    const updated = resolveProject(APP.currentProject.id);
    if (updated) APP.currentProject = updated;
    renderProject();
  } catch (err) {
    APP.settingsDirty = false;
    APP.settingsErr = errText(err);
    if (err.status === 409 && apiErrorCode(err) === "version_conflict") {
      APP.settingsNotice = null;
      await loadProjectDetail(true);
    }
    renderProjectContent();
  } finally {
    const b = $("#ps-save");
    if (b && b.isConnected) { b.disabled = false; b.textContent = "保存"; }
  }
}

function openConfirmDialog({ title, bodyHtml, okText = "确认", danger = false, requireText = "", onOk }) {
  rememberFocus();
  $("#modal-title").textContent = title;
  $("#modal-body").innerHTML = `
    <div class="tk-sub">${bodyHtml}</div>
    ${requireText ? `<div class="field"><label for="confirm-text">${esc(requireText)}</label><input id="confirm-text" autocomplete="off"></div>` : ""}

    <div class="form-actions">
      <button type="button" class="btn" id="confirm-cancel">取消</button>
      <button type="button" class="btn ${danger ? "danger" : "primary"}" id="confirm-ok">${esc(okText)}</button>
    </div>`;
  mask.classList.add("show"); modal.classList.add("show");
  $("#confirm-cancel").onclick = closeAll;
  $("#confirm-ok").focus();
  $("#confirm-ok").onclick = async () => {
    const btn = $("#confirm-ok");
    btn.disabled = true; btn.textContent = "处理中…";
    try {
      await onOk();

    } catch (err) {
      $("#confirm-err").textContent = errText(err);

}

function archiveProject() {
  if (projectArchived()) return;
  const p = APP.currentProject;
  if (!p) return;
  openConfirmDialog({
    title: "归档项目",
    bodyHtml: `确认归档 <b>${esc(p.name)}</b>（<span class="mono">${esc(p.code)}</span>）？<br><br>
      归档后：项目进入只读；任务创建/流转、交付验收、设置保存全部禁用；已采集数据保留，可随时恢复。`,
    okText: "确认归档",
    danger: true,
    onOk: async () => {
      await fetchJSON(`/api/projects/${encodeURIComponent(p.id)}/archive`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      APP.settingsNotice = "项目已归档";
      APP.settingsErr = null;
      APP.settingsDirty = false;
      APP.projectDetail = null;
      await ensureProjects(true);
      const updated = resolveProject(p.id);
      if (updated) APP.currentProject = updated;
      await loadProjectDetail(true);
      renderProject();

  });
}

async function restoreProject() {
  const p = APP.currentProject || APP.projectDetail;
  if (!p) return;
  const id = p.id;
  try {
    await fetchJSON(`/api/projects/${encodeURIComponent(id)}/restore`, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    APP.settingsNotice = "项目已恢复为进行中";
    APP.settingsErr = null;
    APP.settingsDirty = false;
    APP.projectDetail = null;
    await ensureProjects(true);
    const updated = resolveProject(id);
    if (updated) APP.currentProject = updated;
    await loadProjectDetail(true);
    renderProject();
  } catch (e) {
    APP.settingsErr = errText(e);
    APP.settingsNotice = null;
    if (ROUTE.kind === "project") {
      if (ROUTE.tab === "settings") renderProjectContent();

function roleLabels(list) {
  return (list || []).map(x => {

    return x.display_name || x.role_key || x.name || x.instance_key || x.id || "—";
  });
}

function roleDiffSection(title, list, cls, emptyText) {

  return `<div>

async function openTemplatePreview() {
  if (projectArchived()) return;
  const p = APP.currentProject;
  const d = APP.projectDetail || p;
  const key = d.team_template_key || p.team_template_key;
  if (!key) { APP.settingsErr = "项目未绑定团队模板"; renderProjectContent(); return; }
  const version = d.team_template_version ?? p.team_template_version;
  const payload = { template_key: key };
  if (version != null) payload.version = version;

  rememberFocus();
  $("#modal-title").textContent = "预览应用模板";
  $("#modal-body").innerHTML = `<div class="kv"><span class="k">模板</span><span class="v mono">${esc(String(key))}${version != null ? ` v${esc(String(version))}` : ""}</span></div>${skeletonBox(140)}`;
  mask.classList.add("show"); modal.classList.add("show");
  try {

      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    const diff = res?.diff || res || {};

    const removed = diff.removed || [];

    $("#modal-body").innerHTML = `
      <div class="kv"><span class="k">模板</span><span class="v mono">${esc(String(key))}${version != null ? ` v${esc(String(version))}` : ""}</span></div>

        ? `<div class="banner warn" data-testid="template-removed-warning"><b>模板外角色</b><span class="grow">以下角色在新模板中不存在，但不会被删除（运行中 Agent 保护），仅保留为额外实例。</span></div>`
        : `<div class="notice"><span aria-hidden="true">✓</span><span class="grow">没有需要移除的角色。</span></div>`}
      ${roleDiffSection("新增", added, "in_progress", "没有新增角色")}
      ${roleDiffSection("更新", updated, "review", "没有需要更新的角色")}
      ${roleDiffSection("移除", removed, "rejected", "没有移除角色")}
      ${roleDiffSection("保留", kept, "done", "没有保留角色")}
      <div class="form-err" id="tpl-err" role="alert"></div>
      <div class="form-actions">
        <button type="button" class="btn" id="tpl-cancel">取消</button>
        <button type="button" class="btn primary" id="tpl-apply" data-testid="template-apply">确认应用</button>

    $("#tpl-apply").onclick = async () => {
      const btn = $("#tpl-apply");
      btn.disabled = true; btn.textContent = "应用中…";
      try {
        await fetchJSON(`/api/projects/${encodeURIComponent(p.id)}/team/apply`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        closeAll();
        APP.settingsNotice = "团队模板已应用（现有角色实例已保留）";
        APP.settingsErr = null;
        APP.teamTemplate = null;
        APP.projectDetail = null;
        await loadProjectDetail(true);
        if (ROUTE.tab === "settings") renderProjectContent();
      } catch (err) {
        $("#tpl-err").textContent = errText(err);
        btn.disabled = false; btn.textContent = "确认应用";
      }
    };
  } catch (err) {
    $("#modal-body").innerHTML = `
      <div class="kv"><span class="k">模板</span><span class="v mono">${esc(String(key))}</span></div>
      <div class="banner" role="alert"><span class="grow">预览失败：${esc(errText(err))}</span></div>
      <div class="form-actions"><button type="button" class="btn" id="tpl-cancel">关闭</button></div>`;
    const c = $("#tpl-cancel");
    if (c) c.onclick = closeAll;
  }
}

function bindSettings() {
  $$("#set-theme button").forEach(btn => {
    btn.onclick = () => setTheme(btn.dataset.themeBtn);
  });
  const sel = $("#set-interval");
  if (sel) sel.onchange = () => {
    safeSet("agws-refresh-ms", sel.value);
    scheduleStatePolling();
    updateUpdated();
  };
  const form = $("#ps-form");
  if (form) {
    form.addEventListener("input", () => { APP.settingsDirty = true; });
    form.onsubmit = saveProjectSettings;
  }
  const reset = $("#ps-reset");
  if (reset) reset.onclick = () => { APP.settingsDirty = false; APP.settingsErr = null; renderProjectContent(); };
  const retry = $("#ps-retry-detail");
  if (retry) retry.onclick = () => loadProjectDetail(true);
  const arch = $("#ps-archive");
  if (arch) arch.onclick = archiveProject;
  const restore = $("#ps-restore");
  if (restore) restore.onclick = restoreProject;
  const tpl = $("#ps-template-preview");
  if (tpl) tpl.onclick = openTemplatePreview;
}

/* ---------- 复用区块：Worktree / 用量 / 执行记录 / 报告 ---------- */
function wtFormShort(form) {
  const f = String(form || "");
  if (f.includes("Subagent")) return "Subagent";
  if (f.includes("只读")) return "只读";
  if (f.includes("Session")) return "Session";
  if (f.includes("独立")) return "独立";
  return f || "worktree";
}
function commitMessage(raw) {
  const text = String(raw || "").trim();
  if (!text) return "-";
  const m = text.match(/^[0-9a-f]{7,40}\s+(.*)$/i);
  return m ? m[1] : text;
}
function pathTail(path) {
  const parts = String(path || "").replace(/[\\/]+$/, "").split(/[\\/]/).filter(Boolean);
  return parts.length ? parts[parts.length - 1] : (path || "—");
}
function renderWorktrees(rows) {
  const tbody = $("table#wt tbody");
  if (!tbody) return;
  const list = rows.filter(w => filtered(w.role) || filtered(w.path) || filtered(w.branch));
  tbody.innerHTML = list.length ? list.map(w => {
    const form = w.form ? wtFormShort(w.form) : "";
    const head = (w.head || "").slice(0, 7) || "-";
    return `
    <tr>
      <td class="wt-role" title="${esc(w.role)}${w.form ? " · " + esc(w.form) : ""}">
        <span class="wt-role-name">${esc(w.role)}</span>${form ? `<span class="wt-form">${esc(form)}</span>` : ""}
      </td>
      <td class="mono wt-tail" title="${esc(w.path)}">${esc(pathTail(w.path))}</td>
      <td class="mono wt-branch" title="${esc(w.branch || "-")}"><span class="clamp-2">${esc(w.branch || "-")}</span></td>
      <td class="mono wt-head" title="HEAD ${esc(w.head || "-")} · 未提交 ${esc(String(w.dirty ?? 0))}">${esc(head)}${w.present ? (w.dirty ? `<span class="badge-dirty">${esc(w.dirty)}</span>` : "") : `<span class="pri pri-P0" style="margin-left:5px">缺失</span>`}</td>
      <td class="mono wt-last" title="${esc(commitMessage(w.last_commit))}"><span class="wt-msg clamp-3">${esc(commitMessage(w.last_commit))}</span></td>
    </tr>`; }).join("") : `<tr><td colspan="5" class="empty">${rows.length ? "没有匹配的 worktree" : "暂无 worktree 数据"}</td></tr>`;
  initColumnResizers();
}

function renderUsage(u) {
  const el = $("#usage");
  if (!el) return;
  if (!u) { el.innerHTML = `<div class="empty">暂无用量数据</div>`; const src = $("#usage-src"); if (src) src.textContent = ""; return; }
  const isCC = u.source === "ccusage";
  $("#usage-src").textContent = isCC ? "ccusage" : "本地 transcript";
  const tokens = u.total_tokens || 0;
  const cache = u.cache_read_tokens || 0;
  const inp = u.input_tokens || 0;
  const out = u.output_tokens || 0;
  const sum = cache + inp + out || 1;
  const cost = u.cost_usd;
  const days = u.days || [];
  const maxDay = Math.max(1, ...days.map(d => d.tokens || 0));
  const models = u.model_breakdown || [];
  const maxModel = Math.max(1, ...models.map(m => m.tokens || 0));

  el.innerHTML = `
    <div class="usage-row">
      <span class="k">${isCC ? "今日 tokens" : "24h tokens"}</span>
      <span class="v">${fmtNum(tokens)}</span>
      ${isCC && u.period ? `<span class="mono" style="margin-left:auto">${esc(u.period)}</span>` : ""}
    </div>
    <div class="usage-bar" style="display:flex">
      <i style="width:${(cache/sum*100).toFixed(1)}%;border-radius:0"></i>
      <i style="width:${(inp/sum*100).toFixed(1)}%;background:#7b5cff;border-radius:0"></i>
      <i style="width:${(out/sum*100).toFixed(1)}%;background:var(--stall);border-radius:0"></i>
    </div>
    <div class="legend">
      <span><i style="background:var(--primary)"></i>缓存读 ${fmtNum(cache)}</span>
      <span><i style="background:#7b5cff"></i>输入 ${fmtNum(inp)}</span>
      <span><i style="background:var(--stall)"></i>输出 ${fmtNum(out)}</span>
    </div>
    ${cost != null ? `<div class="usage-row"><span class="k">估算成本</span><span class="v">$${Number(cost).toFixed(2)}</span>
      <span class="mono" style="margin-left:auto">近 ${days.length} 天合计 $${days.reduce((a,d)=>a+(d.cost||0),0).toFixed(2)}</span></div>` : ""}
    ${days.length > 1 ? `<div class="divider"></div>
    <div style="font-size:11.5px;color:var(--muted)">近 ${days.length} 天用量</div>
    <div class="spark">${days.map((d, i) => `
      <div class="bar ${i === days.length-1 ? "today" : ""}" title="${esc(d.date)} · ${fmtNum(d.tokens)} tokens">
        <i style="height:${Math.max(3, (d.tokens/maxDay)*100)}%"></i>
        <span>${esc(String(d.date||"").slice(5))}</span>
      </div>`).join("")}</div>` : ""}
    ${models.length ? `<div class="divider"></div>
      <div style="font-size:11.5px;color:var(--muted)">模型构成</div>
      ${models.map(m => `<div class="mrow">
        <div><div>${esc(m.name || "unknown")}</div>
          <div class="bar2"><i style="width:${(m.tokens/maxModel*100).toFixed(1)}%"></i></div></div>
        <div style="text-align:right">${fmtNum(m.tokens)}<div class="mono">$${Number(m.cost||0).toFixed(2)}</div></div>
      </div>`).join("")}` : ""}
    ${u.note ? `<div class="mono">${esc(u.note)}</div>` : ""}`;
}

        <span class="dot ${esc(a.status)}"></span>

    if (list.length > 9) {
      moreA.style.display = "block";
      moreA.textContent = agentsExpanded ? "收起" : `显示全部 ${list.length} 条`;
      moreA.onclick = () => { agentsExpanded = !agentsExpanded; renderAgents(rows); };
    } else moreA.style.display = "none";
  }
}

function renderReports(rows, limit = null) {
  const tbody = $("table#reports tbody");
  if (!tbody) return;
  const list = rows.filter(r => filtered(r.name) || filtered(r.dir));
  const cap = limit || (reportsExpanded ? list.length : 8);
  const shown = list.slice(0, cap);
  tbody.innerHTML = shown.length ? shown.map(r => `
    <tr class="file-row" data-path="${esc(r.path)}" role="button" tabindex="0">
      <td class="wrap2"><span class="clamp-2" title="${esc(r.name)}">${esc(r.name)}</span></td><td class="mono">${esc(r.dir)}</td>
      <td class="mono">${fmtSize(r.size)}</td><td class="mono">${ago(r.mtime)}</td>
    </tr>`).join("") : `<tr><td colspan="4" class="empty">${rows.length ? "没有匹配的交付物" : "暂无交付物"}</td></tr>`;
  const more = $("#reports-more");
  if (more) {
    if (!limit && list.length > 8) {
      more.style.display = "block";
      more.textContent = reportsExpanded ? "收起" : `显示全部 ${list.length} 项`;
      more.onclick = () => { reportsExpanded = !reportsExpanded; renderReports(rows); };
    } else more.style.display = "none";
  }
  $$("#reports .file-row").forEach(rowEl => {
    const fn = () => openFile(rowEl.dataset.path);
    rowEl.onclick = fn;
    rowEl.onkeydown = (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); fn(); } };
  });
  initColumnResizers();
}

$("#task-drawer-close").onclick = closeAll;
