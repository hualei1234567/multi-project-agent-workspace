# 平台 CI（R4）：与 scripts/test.sh 等价 + route contract + UI 冒烟。
#
# 设计原则：
# 1. 平台零第三方运行时依赖（纯 stdlib），只装测试依赖；
# 2. 不引入本机专属路径 —— 所有路径由仓库相对路径或 CI 自带工具推导；
# 3. 不上传任何 Secret；失败时只上传脱敏后的日志；
# 4. 不做部署、不自动合并、不修改 Rulesets（见修复包 §6）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 最小权限：只读仓库内容。
permissions:
  contents: read

# 同一分支的重复触发取消旧任务，避免排队浪费。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Python
  python:
    name: Python · pytest + ruff + py_compile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 与部署目标一致（见 ruff.toml：target py310），
          # 用 3.11 跑是因为本地开发环境就是 3.11，避免出现「本地过 CI 不过」。
          python-version: "3.11"

      - name: 安装测试依赖
        # 平台运行时是纯 stdlib，依赖表只有测试工具。版本与本地 venv 对齐。
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest==9.2.0" "ruff==0.17.3"

      - name: py_compile
        run: python -m py_compile app/agents_dashboard.py app/agent_platform/*.py app/agent_platform/p4/*.py

      - name: ruff
        run: ruff check app/agent_platform app/tests app/agents_dashboard.py

      - name: pytest
        # 与本地 scripts/test.sh 的 cmd 一致（cwd=app，跑 tests）。
        working-directory: app
        run: python -m pytest tests -q --junitxml=../pytest-report.xml

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------- 契约
  route-contract:
    name: Route Contract · OpenAPI 双写一致性
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest==9.2.0"
      - name: 路由与 OpenAPI 必须一致
        # 单独成一个 job：契约漂移是「代码改了文档没改」这类最容易漏的问题，
        # 混在 pytest 里失败时不容易一眼看出是契约问题。
        working-directory: app
        run: python -m pytest tests/test_route_contract.py -v

  # ---------------------------------------------------------------- UI 冒烟
  ui-smoke:
    name: UI Smoke · 浏览器端到端
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安装 playwright
        # 冒烟脚本用本机 Chrome（channel 或 executablePath）。CI 里装 chromium
        # 并显式指向它，避免「本机绿 CI 红」。
        #
        # .npmrc 已从仓库移除（本机配置，见 .npmrc.example）。
        # 这里仍显式指定 registry：lock 文件里的 resolved 指向作者本机的
        # npmmirror 镜像，CI 网络下未必可达。只换源不改版本，lock 仍是版本真相。
        run: |
          npm config set registry https://registry.npmjs.org
          npm ci
          npx playwright install --with-deps chromium

      - name: 启动隔离实例
        # 用临时库 + 临时项目配置，绝不碰仓库里的 data/platform.db。
        # 埋点：9098 避开默认 8098，避免与残留进程冲突。
        run: |
          mkdir -p /tmp/agws-ci/projects /tmp/agws-ci/repo
          # 不用 heredoc：YAML 块标量的缩进会原样带进文件内容。
          printf '%s\n' '{"projects": [{"id": "material", "code": "material", "name": "MaterialDev", "repo_root": "/tmp/agws-ci/repo"}], "default_project_id": "material"}' > /tmp/agws-ci/projects.json
          python -c "import json;json.load(open('/tmp/agws-ci/projects.json'));print('配置 JSON 有效')"
          AGWS_PLATFORM_DB=/tmp/agws-ci/platform.db \
          AGWS_PLATFORM_CONFIG=/tmp/agws-ci/projects.json \
          AGWS_PLATFORM_PROJECTS_ROOT=/tmp/agws-ci/projects \
          AGWS_PLATFORM_EXECUTOR=off \
            python app/agents_dashboard.py --port 9098 > /tmp/agws-ci/server.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:9098/healthz >/dev/null 2>&1; then
              echo "实例已就绪"; break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9098/healthz

      - name: UI 冒烟
        env:
          AGWS_URL: http://127.0.0.1:9098
          AGWS_DB: /tmp/agws-ci/platform.db
        # 用与本地同一个前置自检脚本：两边条件不一致是「本机绿 CI 红」的根源。
        run: |
          export AGWS_CHROME="$(node -e "const{chromium}=require('playwright');console.log(chromium.executablePath())")"
          ./scripts/ci-smoke.sh

      - name: 失败时上传服务日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-server-log
          path: /tmp/agws-ci/server.log
          retention-days: 7

  # ---------------------------------------------------------------- 汇总
  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [python, route-contract, ui-smoke]
    if: always()
    steps:
      - name: 任一必需 job 失败则整体失败
        # 这个 job 只做聚合，给 Branch Protection 一个稳定的 Required Check 名。
        run: |
          echo "python=${{ needs.python.result }}"
          echo "route-contract=${{ needs.route-contract.result }}"
          echo "ui-smoke=${{ needs.ui-smoke.result }}"
          if [ "${{ needs.python.result }}" != "success" ] \
             || [ "${{ needs.route-contract.result }}" != "success" ] \
             || [ "${{ needs.ui-smoke.result }}" != "success" ]; then
            echo "::error::CI 未通过"
            exit 1
          fi
          echo "✅ 全部通过"
